julia_compat = "1.10"
lazy_artifacts = false
name = "LAGraph"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """# Use CMake_jll instead of the older CMake bundled in the build image.\napk del cmake\ncd ${WORKSPACE}/srcdir/LAGraph\ninstall_license LICENSE\nCMAKE_FLAGS=()\n# Older x86 glibc exposes clock_gettime through librt.\nif [[ \"${target}\" == *86*-linux-gnu ]]; then\n    CMAKE_FLAGS+=(-DCMAKE_C_STANDARD_LIBRARIES=-lrt)\nfi\ncmake -S . -B build -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DGraphBLAS_ROOT=${prefix} \\\n      -DGRAPHBLAS_INCLUDE_DIR=${includedir} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DBUILD_TESTING=OFF \\\n      -DBUILD_STATIC_LIBS=OFF \"${CMAKE_FLAGS[@]}\"\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
toplevel_block = ""
version = "v1.2.2"

