julia_compat = "1.10"
lazy_artifacts = true
name = "LightGBM"
platforms = ["i686-linux-gnu-cxx11-cuda+none", "x86_64-linux-gnu-cxx11-cuda+none", "aarch64-linux-gnu-cxx11-cuda+none", "armv6l-linux-gnueabihf-cxx11-cuda+none", "armv7l-linux-gnueabihf-cxx11-cuda+none", "powerpc64le-linux-gnu-cxx11-cuda+none", "i686-linux-musl-cxx11-cuda+none", "x86_64-linux-musl-cxx11-cuda+none", "aarch64-linux-musl-cxx11-cuda+none", "armv6l-linux-musleabihf-cxx11-cuda+none", "armv7l-linux-musleabihf-cxx11-cuda+none", "x86_64-apple-darwin-cuda+none", "aarch64-apple-darwin-cuda+none", "x86_64-unknown-freebsd-cuda+none", "aarch64-unknown-freebsd-cuda+none", "i686-w64-mingw32-cxx11-cuda+none", "x86_64-w64-mingw32-cxx11-cuda+none", "x86_64-linux-gnu-cxx11-cuda+11.4", "x86_64-linux-gnu-cxx11-cuda+12.0"]
script = """cd $WORKSPACE/srcdir/LightGBM\ngit submodule update --init --depth=1\ngit submodule update --checkout --depth=1\n\n# https://github.com/microsoft/LightGBM/pull/6457\natomic_patch -p1 \"$WORKSPACE/srcdir/patches/lightgbm-cmake-find-cuda.patch\"\n\nFLAGS=()\ncmake_extra_args=()\n\nif [[ \"${bb_full_target}\" == *\"apple-darwin\"* ]]; then\n  cmake_extra_args+=(-DAPPLE=1 -DAPPLE_OUTPUT_DYLIB=1)\nfi\n\nif [[ \"${bb_full_target}\" == *-mingw* ]]; then\n  cmake_extra_args+=(-DWIN32=1 -DMINGW=1)\n  FLAGS+=(LDFLAGS=\"-no-undefined\")\nfi\n\nif [[ \"${bb_full_target}\" == *-linux* ]]; then\n  cmake_extra_args+=(-DUSE_GPU=1)\nfi\n\nif  [[ (\"${bb_full_target}\" == *-cuda*) && (\"${bb_full_target}\" != *-cuda+none*) ]]; then\n  # nvcc writes to /tmp, which is a small tmpfs in our sandbox.\n  # make it use the workspace instead\n  export TMPDIR=${WORKSPACE}/tmpdir\n  mkdir ${TMPDIR}\n  export CUDA_PATH=${WORKSPACE}/destdir/cuda\n  export PATH=$PATH:$CUDA_PATH/bin/\n\n  cmake_extra_args+=(-DUSE_CUDA=1 -DCMAKE_CUDA_FLAGS=\"-L${CUDA_PATH}/lib -L${CUDA_PATH}/lib/stubs\")\nfi\n\ncmake . \\\n  -DCMAKE_INSTALL_PREFIX=$prefix\\\n  -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n  -DCMAKE_BUILD_TYPE=Release \\\n  \"${cmake_extra_args[@]}\"\n\nmake -j${nproc} \"${FLAGS[@]}\"\nmake install\ninstall_license LICENSE\n"""
