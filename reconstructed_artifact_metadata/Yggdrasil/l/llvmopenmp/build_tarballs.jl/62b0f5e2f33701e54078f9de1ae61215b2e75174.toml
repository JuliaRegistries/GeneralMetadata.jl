augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "LLVMOpenMP"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/llvm-project-*/\n# https://github.com/msys2/MINGW-packages/blob/d440dcb738/mingw-w64-clang/0901-cast-to-make-gcc-happy.patch\natomic_patch -p1 --directory=openmp $WORKSPACE/srcdir/patches/0901-cast-to-make-gcc-happy.patch\n\nplatform_config=()\nif [[ \"${target}\" == *-mingw* ]]; then\n    # backport https://gitlab.kitware.com/cmake/cmake/-/commit/78f758a463516a78a9ec8d472080c6e61cb89c7f\n    sed -i \"s@/c  */Fo@-c -Fo@\" /usr/share/cmake/Modules/CMakeASM_MASMInformation.cmake\n    sed -i \"s@libomp_append(asmflags_local /@libomp_append(asmflags_local -@\" openmp/cmake/modules/LibompHandleFlags.cmake\n    if [[ \"${target}\" == *x86_64* ]]; then\n        platform_config+=(-DLIBOMP_ASMFLAGS=\"-win64\")\n    fi\n    platform_config+=(-DCMAKE_ASM_MASM_COMPILER=\"uasm\")\nelif [[ \"${target}\" == aarch64-apple-* ]]; then\n    # Linking libomp requires the function `__divdc3`, which is implemented in\n    # `libclang_rt.osx.a` from LLVM compiler-rt.\n    platform_config+=(-DCMAKE_SHARED_LINKER_FLAGS=\"-L${libdir}/darwin -lclang_rt.osx\")\nfi\n# LLVM 23 removed the standalone `openmp/` build; go through `runtimes/` instead.\nmkdir build && cd build\ncmake -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n    -DLLVM_ENABLE_RUNTIMES=openmp \\\n    -DLLVM_ENABLE_PER_TARGET_RUNTIME_DIR=OFF \\\n    -DLLVM_INCLUDE_TESTS=OFF \\\n    -DLLVM_INCLUDE_DOCS=OFF \\\n    -DLIBOMP_INSTALL_ALIASES=OFF \\\n    -DOPENMP_ENABLE_LIBOMPTARGET=OFF \\\n    \"${platform_config[@]}\" \\\n    ../runtimes\nmake -j${nproc}\nmake install\n\ninstall_license ../openmp/LICENSE.TXT\n"""
toplevel_block = ""
version = "v23.1.1"

