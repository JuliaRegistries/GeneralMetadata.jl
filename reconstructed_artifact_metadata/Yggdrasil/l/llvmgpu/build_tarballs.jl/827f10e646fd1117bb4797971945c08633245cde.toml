build_version = "1.2.12"
compat = "1.2.12"
name = "Zlib_jll"
platforms = ["any"]
top_level = false
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = true
libnames = ["libLLVMGPU"]
type = "lib"
variable_name = "libLLVMGPU"

