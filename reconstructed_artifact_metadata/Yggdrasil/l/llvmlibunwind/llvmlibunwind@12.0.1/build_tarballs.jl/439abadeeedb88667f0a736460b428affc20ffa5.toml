augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "LLVMLibUnwind"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/libunwind*\n\nCMAKE_FLAGS=()\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=$prefix)\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=MinSizeRel)  # Note: Disables debug messages\nCMAKE_FLAGS+=(-DLIBUNWIND_INCLUDE_DOCS=OFF)\nCMAKE_FLAGS+=(-DLIBUNWIND_ENABLE_PEDANTIC=OFF)\n\nif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    # Support for threading requires Windows Vista.\n    export CXXFLAGS=\"-D_WIN32_WINNT=0x0600\"\nfi\n\nif ! llvm-config --src-root >/dev/null 2>&1; then\n    # Recent llvm-config no longer supports `--src-root`, which the standalone\n    # build requires. Don't use it, and define what LLVM's HandleLLVMOptions\n    # would have.\n    CMAKE_FLAGS+=(-DLLVM_PATH=${WORKSPACE}/srcdir/no-llvm)\n    export CXXFLAGS=\"${CXXFLAGS} -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS\"\nfi\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\n    for f in $WORKSPACE/srcdir/patches/*.patch; do\n        echo \"Applying patch ${f}\"\n        atomic_patch -p2 ${f}\n    done\nfi\n\nmkdir build && cd build\ncmake \"${CMAKE_FLAGS[@]}\" ..\nmake -j${nprocs}\nmake install\n\n# Install header files. Required to access patched in functions\ncp -aR ../include ${prefix}/\n\n# Move over the DLL. TODO: There may be a CMAKE flag for this.\nif [[ ${target} == *mingw32* ]]; then\n    mkdir -p \"${libdir}\"\n    mv -v lib/libunwind.dll \"${libdir}\"\nfi\n"""
toplevel_block = ""
version = "v12.0.1"

[build_options]
compression_format = "\"gzip\""
preferred_gcc_version = "v\"6.1.0\""

