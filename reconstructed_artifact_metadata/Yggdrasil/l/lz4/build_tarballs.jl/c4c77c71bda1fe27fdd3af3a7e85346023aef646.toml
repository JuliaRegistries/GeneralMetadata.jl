augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Lz4"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/lz4\n# old glibc on aarch64 hides st_mtim under _POSIX_C_SOURCE\nexport CPPFLAGS=\"-D_DEFAULT_SOURCE\"\n# See <https://github.com/lz4/lz4/issues/1474>\nif [[ \"${target}\" == *86*-linux-gnu ]]; then\n    # clock_gettime needs librt with the old glibc on x86 linux\n    export LDFLAGS=\"-lrt\"\nfi\nmake -j${nproc} CFLAGS=\"-O3 -fPIC\"\nmake install\nif [[ \"${target}\" == *-mingw* ]]; then\n    mkdir -p \"${prefix}/lib\"\n    mv \"${libdir}/liblz4.a\" \"${prefix}/lib/.\"\n    mv \"${libdir}/liblz4.dll.a\" \"${prefix}/lib/.\"\nfi\n"""
toplevel_block = ""
version = "v1.11.1"

[build_options]
compression_format = "\"gzip\""

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["liblz4", "msys-lz4"]
type = "lib"
variable_name = "liblz4"
