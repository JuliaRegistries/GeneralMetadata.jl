name = "dftd4"
platforms = ["i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "riscv64-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran5", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran5"]
script = """# The rootfs ships meson 1.8.0, which upstream rejects because of a known bug.\n# Install a newer meson into a private directory\npython3 -m pip install --ignore-installed --target=/tmp/meson meson==1.11.2\nexport PYTHONPATH=\"/tmp/meson${PYTHONPATH:+:${PYTHONPATH}}\"\nexport PATH=\"/tmp/meson/bin:${PATH}\"\n\ncd ${WORKSPACE}/srcdir/dftd4-*\n\n# On FreeBSD, meson-built dependencies ship their pkg-config files in libdata/pkgconfig,\n# which is not on the default search path.\nexport PKG_CONFIG_PATH=\"${PKG_CONFIG_PATH:+${PKG_CONFIG_PATH}:}${prefix}/libdata/pkgconfig\"\n\nif [[ \"${target}\" == *mingw* ]]; then\n    LBT=\"blastrampoline-5\"\nelse\n    LBT=\"blastrampoline\"\nfi\n\n# GCC is used for C as well so that meson's OpenMP check succeeds for both languages\nmeson setup build \\\n    --cross-file=\"${MESON_TARGET_TOOLCHAIN%.*}_gcc.meson\" \\\n    --prefix=${prefix} \\\n    --buildtype=release \\\n    --wrap-mode=nodownload \\\n    -Ddefault_library=shared \\\n    -Dlapack=custom \\\n    -Dcustom_libraries=\"-L${libdir},${LBT}\"\nmeson compile -C build -j${nproc}\nmeson install -C build\ninstall_license COPYING COPYING.LESSER\n"""
toplevel_block = ""
version = "v4.3.0"

