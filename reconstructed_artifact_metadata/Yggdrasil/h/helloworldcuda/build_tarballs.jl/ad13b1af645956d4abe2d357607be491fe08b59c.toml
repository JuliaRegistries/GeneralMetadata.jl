name = "HelloWorldCUDA"
platforms = ["i686-linux-gnu-cuda+none", "x86_64-linux-gnu-cuda+none", "aarch64-linux-gnu-cuda+none", "armv6l-linux-gnueabihf-cuda+none", "armv7l-linux-gnueabihf-cuda+none", "powerpc64le-linux-gnu-cuda+none", "riscv64-linux-gnu-cuda+none", "i686-linux-musl-cuda+none", "x86_64-linux-musl-cuda+none", "aarch64-linux-musl-cuda+none", "armv6l-linux-musleabihf-cuda+none", "armv7l-linux-musleabihf-cuda+none", "x86_64-apple-darwin-cuda+none", "aarch64-apple-darwin-cuda+none", "x86_64-unknown-freebsd-cuda+none", "aarch64-unknown-freebsd-cuda+none", "i686-w64-mingw32-cuda+none", "x86_64-w64-mingw32-cuda+none", "x86_64-linux-gnu-cuda+13.0", "aarch64-linux-gnu-cuda+13.0"]
script = """cd ${WORKSPACE}/srcdir\n\nif [[ \"${bb_full_target}\" != *-cuda+[0-9]* ]]; then\n    CMAKE_FLAGS=(-DHELLO_CUDA=OFF)\nelse\n    # BinaryBuilder's x86_64 host needs x86_64 CUDA tools, paired with the target C++ compiler.\n    if [[ \"${target}\" == aarch64-* ]]; then\n        export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n        export NVCC_PREPEND_FLAGS=\"-ccbin=${CXX}\"\n        rm -rfv ${prefix}/cuda/bin ${prefix}/cuda/nvvm/bin ${prefix}/cuda/nvvm/lib64\n        cp -a cuda_nvcc-linux-x86_64-*-archive/bin ${prefix}/cuda/bin\n        cp -a libnvvm-linux-x86_64-*-archive/nvvm/{bin,lib64} ${prefix}/cuda/nvvm/\n    fi\n\n    # nvcc searches lib64; the SDK uses lib. Vendor libraries require newer glibc symbols.\n    # Keep PTX (75, not 75-real) so newer GPUs can run the kernel.\n    CMAKE_FLAGS=(\n        -DCMAKE_CUDA_COMPILER=${prefix}/cuda/bin/nvcc\n        -DCMAKE_CUDA_FLAGS=\"-L${prefix}/cuda/lib\"\n        -DCMAKE_EXE_LINKER_FLAGS=\"-Wl,--allow-shlib-undefined\"\n        -DCUDAToolkit_ROOT=${prefix}/cuda\n        -DCMAKE_CUDA_ARCHITECTURES=75\n    )\nfi\n\ncmake -B build \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    \"${CMAKE_FLAGS[@]}\"\ncmake --build build --parallel ${nproc}\ncmake --install build\n\n# Modified SDK files would otherwise be packaged.\nif [[ \"${target}\" == aarch64-* ]]; then\n    rm -rfv ${prefix}/cuda\nfi\n\ninstall_license /usr/share/licenses/MIT\n"""
