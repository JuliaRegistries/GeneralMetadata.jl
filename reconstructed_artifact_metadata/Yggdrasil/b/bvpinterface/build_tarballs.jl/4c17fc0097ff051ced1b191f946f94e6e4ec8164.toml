augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "BVPInterface"
platforms = ["i686-linux-gnu-libgfortran5", "x86_64-linux-gnu-libgfortran5", "aarch64-linux-gnu-libgfortran5", "armv6l-linux-gnueabihf-libgfortran5", "armv7l-linux-gnueabihf-libgfortran5", "powerpc64le-linux-gnu-libgfortran5", "riscv64-linux-gnu-libgfortran5", "i686-linux-musl-libgfortran5", "x86_64-linux-musl-libgfortran5", "aarch64-linux-musl-libgfortran5", "armv6l-linux-musleabihf-libgfortran5", "armv7l-linux-musleabihf-libgfortran5", "x86_64-apple-darwin-libgfortran5", "aarch64-apple-darwin-libgfortran5", "x86_64-unknown-freebsd-libgfortran5", "aarch64-unknown-freebsd-libgfortran5", "i686-w64-mingw32-libgfortran5", "x86_64-w64-mingw32-libgfortran5"]
script = """  cd $WORKSPACE/srcdir/BVPInterfac*/src\n\n  # lapack\n  ${FC} -c -O2 -fPIC -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./dc_lapack.o ./dc_lapack.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./dc_lapack_i32.o ./dc_lapack.f\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./lapack.o ./lapack.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./lapack_i32.o ./lapack.f\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./lapackc.o ./lapackc.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./lapackc_i32.o ./lapackc.f\n\n  # slatec\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./slatec.o ./slatec.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./slatec_i32.o ./slatec.f\n\n  # bvpsol\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./bvpsol.o ./bvpsol.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./bvpsol_i32.o ./bvpsol.f\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./linalg_bvpsol.o ./linalg_bvpsol.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./linalg_bvpsol_i32.o ./linalg_bvpsol.f\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./zibconst.o ./zibconst.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./zibconst_i32.o ./zibconst.f\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./ma28_bvpsol.o ./ma28_bvpsol.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./ma28_bvpsol_i32.o ./ma28_bvpsol.f\n  ${FC} -shared -fPIC -o ./libbvpsol.${dlext} ./bvpsol.o ./linalg_bvpsol.o ./zibconst.o ./ma28_bvpsol.o\n  ${FC} -shared -fPIC -o ./libbvpsol_i32.${dlext} ./bvpsol_i32.o ./linalg_bvpsol_i32.o ./zibconst_i32.o ./ma28_bvpsol_i32.o\n  \n  # colnew\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./colnew.o ./colnew.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./colnew_i32.o ./colnew.f\n  ${FC} -shared -fPIC -o ./libcolnew.${dlext} ./colnew.o\n  ${FC} -shared -fPIC -o ./libcolnew_i32.${dlext} ./colnew_i32.o\n\n  # coldae\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./coldae.o ./coldae.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./coldae_i32.o ./coldae.f\n  ${FC} -shared -fPIC -o ./libcoldae.${dlext} ./coldae.o\n  ${FC} -shared -fPIC -o ./libcoldae_i32.${dlext} ./coldae_i32.o\n\n  # colmod\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./colmod.o ./colmod.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./colmod_i32.o ./colmod.f\n  ${FC} -shared -fPIC -o ./libcolmod.${dlext} ./colmod.o\n  ${FC} -shared -fPIC -o ./libcolmod_i32.${dlext} ./colmod_i32.o\n\n  # colsys\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./colsys.o ./colsys.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./colsys_i32.o ./colsys.f\n  ${FC} -shared -fPIC -o ./libcolsys.${dlext} ./colsys.o\n  ${FC} -shared -fPIC -o ./libcolsys_i32.${dlext} ./colsys_i32.o\n\n  # twpbvp\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./twpbvp.o ./twpbvp.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./twpbvp_i32.o ./twpbvp.f\n  ${FC} -shared -fPIC -o ./libtwpbvp.${dlext} ./twpbvp.o\n  ${FC} -shared -fPIC -o ./libtwpbvp_i32.${dlext} ./twpbvp_i32.o\n\n  # bvpm2\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./bvp_la-2.o ./bvp_la-2.f\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -std=f2008 -o ./bvp_m-2.o ./bvp_m-2.f90\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -Wall -Wextra -Wimplicit-interface -std=f2008ts -o ./bvp_m_proxy.o ./bvp_m_proxy.f90\n  ${FC} -shared -fPIC -o ./libbvp_m_proxy.${dlext} ./bvp_m_proxy.o ./bvp_m-2.o ./bvp_la-2.o\n\n  # musl\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./musl.o ./musl.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./musl_i32.o ./musl.f\n  ${FC} -shared -fPIC -o ./libmusl.${dlext} ./musl.o\n  ${FC} -shared -fPIC -o ./libmusl_i32.${dlext} ./musl_i32.o\n\n  # musn\n  ${FC} -c -O2 -fPIC -fdefault-integer-8 -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./musn.o ./musn.f\n  ${FC} -c -O2 -fPIC -fdefault-real-8 -fdefault-double-8 -w -std=legacy -o ./musn_i32.o ./musn.f\n  ${FC} -shared -fPIC -o ./libmusn.${dlext} ./musn.o\n  ${FC} -shared -fPIC -o ./libmusn_i32.${dlext} ./musn_i32.o\n\n  install -Dvm 755 *.${dlext} $libdir\n"""
toplevel_block = ""
