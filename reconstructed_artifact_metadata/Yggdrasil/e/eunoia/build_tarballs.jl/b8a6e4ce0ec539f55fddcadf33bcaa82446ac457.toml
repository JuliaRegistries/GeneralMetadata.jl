augment_platform_block = ""
init_block = ""
julia_compat = "1.12"
lazy_artifacts = false
name = "Eunoia"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/eunoia*\n\nif [[ \"${target}\" == *-musl* ]]; then\n    # Rust defaults to a static C runtime on musl, which prevents building a cdylib.\n    export RUSTFLAGS=\"${RUSTFLAGS} -C target-feature=-crt-static\"\nfi\n\ncargo build --release --locked --package eunoia-capi --target ${rust_target} -j${nproc}\ninstall -Dvm 755 target/${rust_target}/release/*eunoia_capi.${dlext} -t ${libdir}\ninstall_license LICENSE-MIT LICENSE-APACHE\n"""
toplevel_block = ""
version = "v1.10.2"

[build_options]
compilers = "[:c, :rust]"
compression_format = "\"gzip\""

