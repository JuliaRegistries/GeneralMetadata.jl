dependencies = []
name = "Zlib"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "arm-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "arm-linux-musleabihf", "x86_64-apple-darwin14", "x86_64-unknown-freebsd11.1", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/zlib-*\n\n# On windows platforms, our ./configure and make invocations differ a bit\nif [[ ${target} == *-w64-mingw* ]]; then\n    EXTRA_CONFIGURE_FLAGS=\"--sharedlibdir=${prefix}/bin\"\n    EXTRA_MAKE_FLAGS=\"SHAREDLIB=libz.dll SHAREDLIBM=libz-1.dll SHAREDLIBV=libz-1.2.11.dll LDSHAREDLIBC= \"\nfi\n\nif [[ ${target} == *-freebsd* ]]; then\n    cmake -DCMAKE_INSTALL_PREFIX=${prefix}\nelse\n    ./configure ${EXTRA_CONFIGURE_FLAGS} --prefix=${prefix}\nfi\n\nmake install ${EXTRA_MAKE_FLAGS} -j${nproc}\n"""
version = "v1.2.11"

[[products]]
dir_paths = []
dont_dlopen = false
libnames = ["libz"]
type = "lib"
variable_name = "libz"

[[sources]]
"https://zlib.net/zlib-1.2.11.tar.gz" = "c3e5e9fdd5004dcb542feda5ee4f0ff0744628baf8ed2dd5d66f8ca1197cb1a1"
