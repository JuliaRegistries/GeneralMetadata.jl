augment_platform_block = """using Base.BinaryPlatforms\n# Can't use Preferences since we might be running this very early with a non-existing Manifest\nMPIPreferences_UUID = Base.UUID(\"3da0fdf6-3ccc-4f1b-acd9-58baa6c99267\")\nconst preferences = Base.get_preferences(MPIPreferences_UUID)\n\nconst binary_to_abi = Dict(\n    \"MPIABI_jll\" => \"MPIABI\",\n    \"MPICH_jll\" => \"MPICH\",\n    \"MPICH_CUDA_jll\" => \"MPICH\",\n    \"MPItrampoline_jll\" => \"MPItrampoline\",\n    \"MicrosoftMPI_jll\" => \"MicrosoftMPI\",\n    \"OpenMPI_jll\" => \"OpenMPI\",\n)\n\n# Keep logic in sync with MPIPreferences.jl\nfunction augment_mpi!(platform)\n    # Doesn't need to be `const` since we depend on MPIPreferences so we\n    # invalidate the cache when it changes.\n\n    # Determine which jll binary provides our MPI implementation.\n    # Use MPIPreferences if set, otherwise use either MPICH or MicrosoftMPI (on Windows).\n    # Note: MPIPreferences uses `Sys.iswindows()` without the `platform` argument.\n    binary = get(preferences, \"binary\", Sys.iswindows(platform) ? \"MicrosoftMPI_jll\" : \"MPICH_jll\")\n\n    # Convert the jll binary to an ABI\n    if binary == \"system\"\n        abi = get(preferences, \"abi\", nothing)\n        abi === nothing && error(\"MPIPreferences: Inconsistent state detected, `binary` is set to system, but `abi` is not set.\")\n    else\n        abi = get(binary_to_abi, binary, nothing)\n        abi == nothing && error(\"Unknown MPI binary: $binary\")\n    end\n\n    # Add an `mpi` entry to the platform if it's missing\n    if !haskey(platform, \"mpi\")\n        platform[\"mpi\"] = abi\n    end\n\n    return platform\nend\n\naugment_platform!(platform::Platform) = augment_mpi!(platform)\n"""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = true
name = "MicrosoftMPI"
platforms = ["i686-w64-mingw32-libgfortran5-mpi+microsoftmpi", "x86_64-w64-mingw32-libgfortran5-mpi+microsoftmpi"]
script = """apk add p7zip\n\ncd ${WORKSPACE}/srcdir\n7z x -t# msmpisetup.exe -osetup\n7z x msmpisdk.msi -osdk\n# The 64-bit MSI and SDK ship both architectures, with the 64-bit files suffixed \"64\"\nif [[ ${nbits} == 32 ]]; then\n    7z x setup/2.msi -oruntime\n    suffix=\"\"\n    # The stdcall Fortran import libraries only exist for 32-bit\n    import_libs=\"msmpi msmpifec msmpifes msmpifmc msmpifms\"\nelse\n    7z x setup/4.msi -oruntime\n    suffix=\"64\"\n    import_libs=\"msmpi msmpifec msmpifmc\"\nfi\n\ninstall -Dvm 755 runtime/*.exe -t ${bindir}\ninstall -Dvm 755 runtime/msmpi${suffix}.dll ${libdir}/msmpi.dll\ninstall -Dvm 755 runtime/msmpires${suffix}.dll ${libdir}/msmpires.dll\nfor lib in ${import_libs}; do\n    install -Dvm 644 sdk/${lib}${suffix}.lib ${prefix}/lib/${lib}.lib\n    if [[ -n ${suffix} ]]; then\n        # Also keep the SDK's name, which consumers link as e.g. `-lmsmpi64`\n        install -Dvm 644 sdk/${lib}${suffix}.lib -t ${prefix}/lib\n    fi\ndone\n\n# Replace the one non-ASCII byte in mpif.h (Latin-1 0xA0) by a space. Not a patch:\n# the file is CRLF, and .gitattributes would convert a patch's context lines to LF.\nLC_ALL=C sed -i $'s/\\xa0/ /' sdk/mpif.h\ninstall -Dvm 644 sdk/mpi.h sdk/mpio.h sdk/mpif.h sdk/mspms.h sdk/pmidbg.h runtime/mpitrace.man -t ${includedir}\ninstall -Dvm 644 sdk/mpifptr${nbits}.h ${includedir}/mpifptr.h\ninstall -Dvm 644 sdk/mpi.f90 -t ${prefix}/src\n\n# Generate \"mpi.mod\", \"mpi_base.mod\", \"mpi_sizeofs.mod\" and \"mpi_constants.mod\"\ncd ${includedir}\n${FC} -I. ../src/mpi.f90 -fsyntax-only -fno-range-check\n\ninstall_license \\\n    ${WORKSPACE}/srcdir/runtime/*.rtf \\\n    ${WORKSPACE}/srcdir/runtime/*.txt \\\n    ${WORKSPACE}/srcdir/sdk/*.rtf \\\n    ${WORKSPACE}/srcdir/sdk/*.txt\n"""
toplevel_block = ""
