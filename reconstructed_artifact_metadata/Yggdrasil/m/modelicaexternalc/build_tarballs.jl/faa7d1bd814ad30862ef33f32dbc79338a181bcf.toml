augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "ModelicaExternalC"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir\ncase \"${target}\" in\n    *-apple-*) export TARGET_OS=Darwin ;;\n    *-mingw*)  export TARGET_OS=MINGW ;;\n    *)         export TARGET_OS=Linux ;;  # Linux (glibc, musl) and FreeBSD: ELF, the same linker flags\nesac\nOMRuntimeExternalC.jl/deps/build_libraries.sh ModelicaStandardLibrary/Modelica/Resources/C-Sources build\ninstall -Dvm755 \"build/libModelicaExternalC.${dlext}\" \"${libdir}/libModelicaExternalC.${dlext}\"\ninstall_license ModelicaStandardLibrary/LICENSE OMRuntimeExternalC.jl/LICENSE.md OMRuntimeExternalC.jl/THIRD_PARTY_LICENSES.md\n"""
toplevel_block = ""
version = "v4.1.0"

[build_options]
compression_format = "\"gzip\""

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = true
libnames = ["libModelicaExternalC"]
type = "lib"
variable_name = "libModelicaExternalC"

