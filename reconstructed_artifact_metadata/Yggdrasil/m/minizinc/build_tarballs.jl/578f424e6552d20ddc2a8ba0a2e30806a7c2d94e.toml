augment_platform_block = ""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "MiniZinc"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/libminizinc\n\nCMAKE_FLAGS=()\n# mimalloc adds -march=armv8.1-a by default on arm64, which BinaryBuilder forbids.\nCMAKE_FLAGS+=(-DMI_OPT_ARCH=OFF)\n# libmzn is dlopen'ed into Julia, so mimalloc must not replace the\n# process-wide malloc (it segfaults on load). MiniZinc still uses mimalloc\n# for its own AST allocations.\nCMAKE_FLAGS+=(-DMZN_MIMALLOC_OVERRIDE=OFF)\nif [[ \"${target}\" == *-mingw* ]]; then\n    # The tree-sitter grammars mark two symbols __declspec(dllexport), which\n    # disables MinGW's automatic export of every other symbol in libmzn.\n    CMAKE_FLAGS+=(-DCMAKE_SHARED_LINKER_FLAGS=\"-Wl,--export-all-symbols\")\nfi\n\ncmake -B build \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    \"${CMAKE_FLAGS[@]}\"\ncmake --build build --parallel ${nproc}\ncmake --install build\n"""
toplevel_block = ""
version = "v2.11.0"

