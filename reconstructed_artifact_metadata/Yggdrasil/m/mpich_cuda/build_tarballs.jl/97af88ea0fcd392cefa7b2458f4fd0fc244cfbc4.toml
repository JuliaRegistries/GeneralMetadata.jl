augment_platform_block = """using Base.BinaryPlatforms\nusing Base.BinaryPlatforms\n\ntry\n    using CUDA_Runtime_jll\ncatch\n    # during initial package installation, CUDA_Runtime_jll may not be available.\nend\n\n# every other tag that artifacts are selected on must be set before calling this\nfunction augment_cuda_tag!(platform::Platform)\n    if @isdefined(CUDA_Runtime_jll) && isdefined(CUDA_Runtime_jll, :augment_dependent!)\n        # both Pkg and the JLL module include this file from the JLL's `.pkg` directory\n        artifacts_toml = joinpath(@__DIR__, \"..\", \"Artifacts.toml\")\n        CUDA_Runtime_jll.augment_dependent!(platform, artifacts_toml)\n    elseif !haskey(platform, \"cuda\")\n        # CUDA_Runtime_jll is missing during initial installation, or briefly older than\n        # our compat bound while Pkg changes the environment. select the CPU build, if\n        # any; without the tag, Pkg would select any build.\n        platform[\"cuda\"] = \"none\"\n    end\n    return platform\nend\n\nfunction augment_cuda!(platform::Platform)\n    augment_cuda_tag!(platform)\nend\n# Can't use Preferences since we might be running this very early with a non-existing Manifest\nMPIPreferences_UUID = Base.UUID(\"3da0fdf6-3ccc-4f1b-acd9-58baa6c99267\")\nconst preferences = Base.get_preferences(MPIPreferences_UUID)\n\nconst binary_to_abi = Dict(\n    \"MPIABI_jll\" => \"MPIABI\",\n    \"MPICH_jll\" => \"MPICH\",\n    \"MPICH_CUDA_jll\" => \"MPICH\",\n    \"MPItrampoline_jll\" => \"MPItrampoline\",\n    \"MicrosoftMPI_jll\" => \"MicrosoftMPI\",\n    \"OpenMPI_jll\" => \"OpenMPI\",\n)\n\n# Keep logic in sync with MPIPreferences.jl\nfunction augment_mpi!(platform)\n    # Doesn't need to be `const` since we depend on MPIPreferences so we\n    # invalidate the cache when it changes.\n\n    # Determine which jll binary provides our MPI implementation.\n    # Use MPIPreferences if set, otherwise use either MPICH or MicrosoftMPI (on Windows).\n    # Note: MPIPreferences uses `Sys.iswindows()` without the `platform` argument.\n    binary = get(preferences, \"binary\", Sys.iswindows(platform) ? \"MicrosoftMPI_jll\" : \"MPICH_jll\")\n\n    # Convert the jll binary to an ABI\n    if binary == \"system\"\n        abi = get(preferences, \"abi\", nothing)\n        abi === nothing && error(\"MPIPreferences: Inconsistent state detected, `binary` is set to system, but `abi` is not set.\")\n    else\n        abi = get(binary_to_abi, binary, nothing)\n        abi == nothing && error(\"Unknown MPI binary: $binary\")\n    end\n\n    # Add an `mpi` entry to the platform if it's missing\n    if !haskey(platform, \"mpi\")\n        platform[\"mpi\"] = abi\n    end\n\n    return platform\nend\n\nfunction augment_platform!(platform::Platform)\n    augment_cuda!(platform)\n    augment_mpi!(platform)\nend\n"""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = true
name = "MPICH_CUDA"
platforms = ["x86_64-linux-gnu-libgfortran5-cuda+11.8-mpi+mpich", "aarch64-linux-gnu-libgfortran5-cuda_platform+jetson-cuda+11.8-mpi+mpich", "aarch64-linux-gnu-libgfortran5-cuda_platform+sbsa-cuda+11.8-mpi+mpich", "x86_64-linux-gnu-libgfortran5-cuda+12.0-mpi+mpich", "aarch64-linux-gnu-libgfortran5-cuda_platform+jetson-cuda+12.0-mpi+mpich", "aarch64-linux-gnu-libgfortran5-cuda_platform+sbsa-cuda+12.0-mpi+mpich", "x86_64-linux-gnu-libgfortran5-cuda+13.0-mpi+mpich", "aarch64-linux-gnu-libgfortran5-cuda+13.0-mpi+mpich"]
script = ["""CUDA_SM=\"70,75,80,86,89\"\nNVCC_EXTRA_FLAGS=\"-gencode=arch=compute_70,code=sm_70 -gencode=arch=compute_75,code=sm_75 -gencode=arch=compute_80,code=sm_80 -gencode=arch=compute_86,code=sm_86 -gencode=arch=compute_89,code=sm_89 -gencode=arch=compute_89,code=compute_89 -allow-unsupported-compiler\"\n################################################################################\n# Install MPICH\n################################################################################\n\n# Enter the funzone\ncd ${WORKSPACE}/srcdir/mpich*\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/fortran_sentinels_data.patch\n\n# nvcc writes to /tmp, which is a small tmpfs in the sandbox.\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir -p ${TMPDIR}\n\n# BinaryBuilder's x86_64 host needs x86_64 CUDA tools to cross compile for aarch64.\n# nvvm is inside the nvcc archive before CUDA 13, and in its own archive after.\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n    rm -rf ${prefix}/cuda/bin ${prefix}/cuda/nvvm/bin ${prefix}/cuda/nvvm/lib64\n    cp -a ${WORKSPACE}/srcdir/cuda_nvcc-linux-x86_64-*-archive/bin ${prefix}/cuda/bin\n    cp -a ${WORKSPACE}/srcdir/*-linux-x86_64-*-archive/nvvm/{bin,lib64} ${prefix}/cuda/nvvm/\nfi\n\nexport CUDA_HOME=${prefix}/cuda\n\n# Setting `NVCC` stops MPICH's configure scripts from appending their own `-ccbin`.\n# CUDA_SM and NVCC_EXTRA_FLAGS are set per platform below.\nexport NVCC=${CUDA_HOME}/bin/nvcc\nexport NVCC_PREPEND_FLAGS=\"-ccbin=${CXX} ${NVCC_EXTRA_FLAGS}\"\n\n# MPICH links against `libcuda`, which the SDK only provides as a stub.\n# The real library comes from the driver at run time.\n# List `lib` explicitly: MPICH's configure does not add `-L.../lib` when it finds it\n# as a \"word\" inside `-L.../lib/stubs`.\nexport LDFLAGS=\"-L${CUDA_HOME}/lib -L${CUDA_HOME}/lib/stubs\"\n\n# - Do not install doc and man files which contain files which clashing names on\n#   case-insensitive file systems:\n#   * https://github.com/JuliaPackaging/Yggdrasil/pull/315\n#   * https://github.com/JuliaPackaging/Yggdrasil/issues/6344\n# - `--enable-fast=all,O3` leads to very long compile times for some\n#   files. We need to avoid `alwaysinline`.\n\nconfigure_flags=(\n    --build=${MACHTYPE}\n    --disable-dependency-tracking\n    --disable-doc\n    --enable-fast=ndebug,O3\n    --enable-static=no\n    --host=${target}\n    --prefix=${prefix}\n    --with-hwloc=${prefix}\n    # `--with-cuda` makes configure fail instead of silently disabling CUDA\n    --with-cuda=${CUDA_HOME}\n    # Yaksa's default `auto` runs a test program, which fails when cross compiling.\n    # (NVCC_PREPEND_FLAGS also lists these architectures.)\n    --with-cuda-sm=${CUDA_SM}\n)\n\n# Define some obscure undocumented variables needed for cross compilation of\n# the Fortran bindings.  See for example\n# * https://stackoverflow.com/q/56759636/2442087\n# * https://github.com/pmodels/mpich/blob/d10400d7a8238dc3c8464184238202ecacfb53c7/doc/installguide/cfile\nexport CROSS_F77_SIZEOF_INTEGER=4\nexport CROSS_F77_SIZEOF_REAL=4\nexport CROSS_F77_SIZEOF_DOUBLE_PRECISION=8\nexport CROSS_F77_SIZEOF_LOGICAL=4\nexport CROSS_F77_TRUE_VALUE=1\nexport CROSS_F77_FALSE_VALUE=0\n\nexport CROSS_F90_ADDRESS_KIND=8\nexport CROSS_F90_OFFSET_KIND=8\nexport CROSS_F90_INTEGER_KIND=4\nexport CROSS_F90_INTEGER_MODEL=9\nexport CROSS_F90_REAL_MODEL=6,37\nexport CROSS_F90_DOUBLE_MODEL=15,307\nexport CROSS_F90_ALL_INTEGER_MODELS=2,1,4,2,9,4,18,8,38,16,\nexport CROSS_F90_INTEGER_MODEL_MAP={2,1,1},{4,2,2},{9,4,4},{18,8,8},{36,16,16},\n\n./configure \"${configure_flags[@]}\"\n\n# Ensure that CUDA support is actually enabled\ngrep -q '^#define MPL_HAVE_CUDA 1' src/mpl/include/mplconfig.h\ngrep -q '^#define HAVE_CUDA 1' src/mpi/datatype/typerep/yaksa/src/frontend/include/yaksa_config.h\n\n# Ensure that int128 and float16 are natively supported\ngrep -q '#define SIZEOF___INT128' src/include/mpichconf.h\ngrep -q '#define SIZEOF__FLOAT16' src/include/mpichconf.h\n\n# Remove empty `-l` flags from libtool\n# (Why are they there? They should not be.)\n# Run the command several times to handle multiple (overlapping) occurrences.\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\n\n# Build the library\n# BinaryBuilder sets `V=true` or `V=false`, but the rule to build `.cu` files\n# requires `V` to be empty, `0`, or `1`.\nmake -j${nproc} V=0\n\n# Install the library\nmake install V=0\n\n# Install the license\ninstall_license $WORKSPACE/srcdir/mpich*/COPYRIGHT\n\n# Remove everything we may have installed manually\nrm -rf ${prefix}/cuda\n""", """CUDA_SM=\"72,87\"\nNVCC_EXTRA_FLAGS=\"-gencode=arch=compute_72,code=sm_72 -gencode=arch=compute_87,code=sm_87 -gencode=arch=compute_87,code=compute_87 -allow-unsupported-compiler\"\n################################################################################\n# Install MPICH\n################################################################################\n\n# Enter the funzone\ncd ${WORKSPACE}/srcdir/mpich*\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/fortran_sentinels_data.patch\n\n# nvcc writes to /tmp, which is a small tmpfs in the sandbox.\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir -p ${TMPDIR}\n\n# BinaryBuilder's x86_64 host needs x86_64 CUDA tools to cross compile for aarch64.\n# nvvm is inside the nvcc archive before CUDA 13, and in its own archive after.\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n    rm -rf ${prefix}/cuda/bin ${prefix}/cuda/nvvm/bin ${prefix}/cuda/nvvm/lib64\n    cp -a ${WORKSPACE}/srcdir/cuda_nvcc-linux-x86_64-*-archive/bin ${prefix}/cuda/bin\n    cp -a ${WORKSPACE}/srcdir/*-linux-x86_64-*-archive/nvvm/{bin,lib64} ${prefix}/cuda/nvvm/\nfi\n\nexport CUDA_HOME=${prefix}/cuda\n\n# Setting `NVCC` stops MPICH's configure scripts from appending their own `-ccbin`.\n# CUDA_SM and NVCC_EXTRA_FLAGS are set per platform below.\nexport NVCC=${CUDA_HOME}/bin/nvcc\nexport NVCC_PREPEND_FLAGS=\"-ccbin=${CXX} ${NVCC_EXTRA_FLAGS}\"\n\n# MPICH links against `libcuda`, which the SDK only provides as a stub.\n# The real library comes from the driver at run time.\n# List `lib` explicitly: MPICH's configure does not add `-L.../lib` when it finds it\n# as a \"word\" inside `-L.../lib/stubs`.\nexport LDFLAGS=\"-L${CUDA_HOME}/lib -L${CUDA_HOME}/lib/stubs\"\n\n# - Do not install doc and man files which contain files which clashing names on\n#   case-insensitive file systems:\n#   * https://github.com/JuliaPackaging/Yggdrasil/pull/315\n#   * https://github.com/JuliaPackaging/Yggdrasil/issues/6344\n# - `--enable-fast=all,O3` leads to very long compile times for some\n#   files. We need to avoid `alwaysinline`.\n\nconfigure_flags=(\n    --build=${MACHTYPE}\n    --disable-dependency-tracking\n    --disable-doc\n    --enable-fast=ndebug,O3\n    --enable-static=no\n    --host=${target}\n    --prefix=${prefix}\n    --with-hwloc=${prefix}\n    # `--with-cuda` makes configure fail instead of silently disabling CUDA\n    --with-cuda=${CUDA_HOME}\n    # Yaksa's default `auto` runs a test program, which fails when cross compiling.\n    # (NVCC_PREPEND_FLAGS also lists these architectures.)\n    --with-cuda-sm=${CUDA_SM}\n)\n\n# Define some obscure undocumented variables needed for cross compilation of\n# the Fortran bindings.  See for example\n# * https://stackoverflow.com/q/56759636/2442087\n# * https://github.com/pmodels/mpich/blob/d10400d7a8238dc3c8464184238202ecacfb53c7/doc/installguide/cfile\nexport CROSS_F77_SIZEOF_INTEGER=4\nexport CROSS_F77_SIZEOF_REAL=4\nexport CROSS_F77_SIZEOF_DOUBLE_PRECISION=8\nexport CROSS_F77_SIZEOF_LOGICAL=4\nexport CROSS_F77_TRUE_VALUE=1\nexport CROSS_F77_FALSE_VALUE=0\n\nexport CROSS_F90_ADDRESS_KIND=8\nexport CROSS_F90_OFFSET_KIND=8\nexport CROSS_F90_INTEGER_KIND=4\nexport CROSS_F90_INTEGER_MODEL=9\nexport CROSS_F90_REAL_MODEL=6,37\nexport CROSS_F90_DOUBLE_MODEL=15,307\nexport CROSS_F90_ALL_INTEGER_MODELS=2,1,4,2,9,4,18,8,38,16,\nexport CROSS_F90_INTEGER_MODEL_MAP={2,1,1},{4,2,2},{9,4,4},{18,8,8},{36,16,16},\n\n./configure \"${configure_flags[@]}\"\n\n# Ensure that CUDA support is actually enabled\ngrep -q '^#define MPL_HAVE_CUDA 1' src/mpl/include/mplconfig.h\ngrep -q '^#define HAVE_CUDA 1' src/mpi/datatype/typerep/yaksa/src/frontend/include/yaksa_config.h\n\n# Ensure that int128 and float16 are natively supported\ngrep -q '#define SIZEOF___INT128' src/include/mpichconf.h\ngrep -q '#define SIZEOF__FLOAT16' src/include/mpichconf.h\n\n# Remove empty `-l` flags from libtool\n# (Why are they there? They should not be.)\n# Run the command several times to handle multiple (overlapping) occurrences.\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\n\n# Build the library\n# BinaryBuilder sets `V=true` or `V=false`, but the rule to build `.cu` files\n# requires `V` to be empty, `0`, or `1`.\nmake -j${nproc} V=0\n\n# Install the library\nmake install V=0\n\n# Install the license\ninstall_license $WORKSPACE/srcdir/mpich*/COPYRIGHT\n\n# Remove everything we may have installed manually\nrm -rf ${prefix}/cuda\n""", """CUDA_SM=\"70,75,80,86,89,90\"\nNVCC_EXTRA_FLAGS=\"-gencode=arch=compute_70,code=sm_70 -gencode=arch=compute_75,code=sm_75 -gencode=arch=compute_80,code=sm_80 -gencode=arch=compute_86,code=sm_86 -gencode=arch=compute_89,code=sm_89 -gencode=arch=compute_90,code=sm_90 -gencode=arch=compute_90,code=compute_90\"\n################################################################################\n# Install MPICH\n################################################################################\n\n# Enter the funzone\ncd ${WORKSPACE}/srcdir/mpich*\n\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/fortran_sentinels_data.patch\n\n# nvcc writes to /tmp, which is a small tmpfs in the sandbox.\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir -p ${TMPDIR}\n\n# BinaryBuilder's x86_64 host needs x86_64 CUDA tools to cross compile for aarch64.\n# nvvm is inside the nvcc archive before CUDA 13, and in its own archive after.\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n    rm -rf ${prefix}/cuda/bin ${prefix}/cuda/nvvm/bin ${prefix}/cuda/nvvm/lib64\n    cp -a ${WORKSPACE}/srcdir/cuda_nvcc-linux-x86_64-*-archive/bin ${prefix}/cuda/bin\n    cp -a ${WORKSPACE}/srcdir/*-linux-x86_64-*-archive/nvvm/{bin,lib64} ${prefix}/cuda/nvvm/\nfi\n\nexport CUDA_HOME=${prefix}/cuda\n\n# Setting `NVCC` stops MPICH's configure scripts from appending their own `-ccbin`.\n# CUDA_SM and NVCC_EXTRA_FLAGS are set per platform below.\nexport NVCC=${CUDA_HOME}/bin/nvcc\nexport NVCC_PREPEND_FLAGS=\"-ccbin=${CXX} ${NVCC_EXTRA_FLAGS}\"\n\n# MPICH links against `libcuda`, which the SDK only provides as a stub.\n# The real library comes from the driver at run time.\n# List `lib` explicitly: MPICH's configure does not add `-L.../lib` when it finds it\n# as a \"word\" inside `-L.../lib/stubs`.\nexport LDFLAGS=\"-L${CUDA_HOME}/lib -L${CUDA_HOME}/lib/stubs\"\n\n# - Do not install doc and man files which contain files which clashing names on\n#   case-insensitive file systems:\n#   * https://github.com/JuliaPackaging/Yggdrasil/pull/315\n#   * https://github.com/JuliaPackaging/Yggdrasil/issues/6344\n# - `--enable-fast=all,O3` leads to very long compile times for some\n#   files. We need to avoid `alwaysinline`.\n\nconfigure_flags=(\n    --build=${MACHTYPE}\n    --disable-dependency-tracking\n    --disable-doc\n    --enable-fast=ndebug,O3\n    --enable-static=no\n    --host=${target}\n    --prefix=${prefix}\n    --with-hwloc=${prefix}\n    # `--with-cuda` makes configure fail instead of silently disabling CUDA\n    --with-cuda=${CUDA_HOME}\n    # Yaksa's default `auto` runs a test program, which fails when cross compiling.\n    # (NVCC_PREPEND_FLAGS also lists these architectures.)\n    --with-cuda-sm=${CUDA_SM}\n)\n\n# Define some obscure undocumented variables needed for cross compilation of\n# the Fortran bindings.  See for example\n# * https://stackoverflow.com/q/56759636/2442087\n# * https://github.com/pmodels/mpich/blob/d10400d7a8238dc3c8464184238202ecacfb53c7/doc/installguide/cfile\nexport CROSS_F77_SIZEOF_INTEGER=4\nexport CROSS_F77_SIZEOF_REAL=4\nexport CROSS_F77_SIZEOF_DOUBLE_PRECISION=8\nexport CROSS_F77_SIZEOF_LOGICAL=4\nexport CROSS_F77_TRUE_VALUE=1\nexport CROSS_F77_FALSE_VALUE=0\n\nexport CROSS_F90_ADDRESS_KIND=8\nexport CROSS_F90_OFFSET_KIND=8\nexport CROSS_F90_INTEGER_KIND=4\nexport CROSS_F90_INTEGER_MODEL=9\nexport CROSS_F90_REAL_MODEL=6,37\nexport CROSS_F90_DOUBLE_MODEL=15,307\nexport CROSS_F90_ALL_INTEGER_MODELS=2,1,4,2,9,4,18,8,38,16,\nexport CROSS_F90_INTEGER_MODEL_MAP={2,1,1},{4,2,2},{9,4,4},{18,8,8},{36,16,16},\n\n./configure \"${configure_flags[@]}\"\n\n# Ensure that CUDA support is actually enabled\ngrep -q '^#define MPL_HAVE_CUDA 1' src/mpl/include/mplconfig.h\ngrep -q '^#define HAVE_CUDA 1' src/mpi/datatype/typerep/yaksa/src/frontend/include/yaksa_config.h\n\n# Ensure that int128 and float16 are natively supported\ngrep -q '#define SIZEOF___INT128' src/include/mpichconf.h\ngrep -q '#define SIZEOF__FLOAT16' src/include/mpichconf.h\n\n# Remove empty `-l` flags from libtool\n# (Why are they there? They should not be.)\n# Run the command several times to handle multiple (overlapping) occurrences.\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\nsed -i 's/\"-l /\"/g;s/ -l / /g;s/-l\"/\"/g' libtool\n\n# Build the library\n# BinaryBuilder sets `V=true` or `V=false`, but the rule to build `.cu` files\n# requires `V` to be empty, `0`, or `1`.\nmake -j${nproc} V=0\n\n# Install the library\nma