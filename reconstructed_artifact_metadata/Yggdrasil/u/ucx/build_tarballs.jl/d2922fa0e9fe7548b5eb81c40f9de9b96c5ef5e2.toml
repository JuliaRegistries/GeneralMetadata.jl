name = "UCX"
platforms = ["x86_64-linux-gnu-cuda+none", "aarch64-linux-gnu-cuda+none", "x86_64-linux-gnu-cuda+12.2", "x86_64-linux-gnu-cuda+12.3", "x86_64-linux-gnu-cuda+12.4", "x86_64-linux-gnu-cuda+12.5", "x86_64-linux-gnu-cuda+12.6", "x86_64-linux-gnu-cuda+12.8", "x86_64-linux-gnu-cuda+12.9", "x86_64-linux-gnu-cuda+13.0"]
script = """cd $WORKSPACE/srcdir/ucx*\n\n./autogen.sh\nupdate_configure_scripts --reconf\n\nFLAGS=()\nFLAGS+=(--prefix=${prefix})\nFLAGS+=(--build=${MACHTYPE})\nFLAGS+=(--host=${target})\nFLAGS+=(--disable-debug)\nFLAGS+=(--disable-assertions)\nFLAGS+=(--disable-params-check)\nFLAGS+=(--disable-static)\nFLAGS+=(--disable-profiling)\nFLAGS+=(--enable-shared)\nFLAGS+=(--enable-mt)\nFLAGS+=(--enable-frame-pointer)\nFLAGS+=(--enable-cma)\nFLAGS+=(--with-rdmacm=${prefix})\n\nif [[ \"${bb_full_target}\" == *-cuda+[0-9]* ]]; then\n    FLAGS+=(--with-cuda=${prefix}/cuda)\n    export CUDA_HOME=${prefix}/cuda\n    export PATH=$PATH:$CUDA_HOME/bin\n    export CUDACXX=$CUDA_HOME/bin/nvcc\n    export CUDA_LIB=${CUDA_HOME}/lib\nfi\n\n./configure ${FLAGS[@]}\n\n# For a bug in `src/uct/sm/cma/Makefile` that I did't have the time to look\n# into, we have to build with `V=1`\nmake -j${nproc} V=1\nmake install\n\ninstall_license LICENSE\n"""
