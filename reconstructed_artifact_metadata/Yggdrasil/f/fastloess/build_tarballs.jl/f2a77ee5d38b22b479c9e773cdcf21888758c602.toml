augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "fastloess"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/loess-project/bindings/julia\n# Use the system linker. On Linux, force BFD to avoid \"lld not built with zlib support\" errors.\nexport RUSTFLAGS=\"-C linker=${CC}\"\nif [[ \"${target}\" == *-linux-* ]]; then\n\tRUSTFLAGS=\"${RUSTFLAGS} -C link-arg=-fuse-ld=bfd\"\nfi\nif [[ \"${rust_target}\" == *-linux-musl* ]]; then\n    # Musl targets default to a fully static CRT, which does not support cdylib.\n    RUSTFLAGS=\"${RUSTFLAGS} -C target-feature=-crt-static\"\nfi\n# Build the release library\ncargo build --release --target ${rust_target} --target-dir target\n# Install the shared library\ninstall -Dvm755 target/${rust_target}/release/*fastloess_jl.${dlext} -t \"${libdir}\"\n# Install licenses\ninstall_license LICENSE-MIT\ninstall_license LICENSE-APACHE\n"""
toplevel_block = ""
version = "v3.0.0"

[build_options]
compilers = "[:rust, :c]"
compression_format = "\"gzip\""
lock_microarchitecture = "false"
preferred_gcc_version = "v\"10.0.0\""

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = true
libnames = ["libfastloess_jl", "fastloess_jl"]
type = "lib"
variable_name = "libfastloess_jl"

