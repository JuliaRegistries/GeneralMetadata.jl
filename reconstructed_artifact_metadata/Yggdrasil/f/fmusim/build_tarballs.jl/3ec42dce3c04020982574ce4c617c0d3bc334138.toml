augment_platform_block = ""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "fmusim"
platforms = ["x86_64-linux-gnu", "aarch64-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-w64-mingw32"]
script = """cd ${WORKSPACE}/srcdir/fmi-rs\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/fmi-rs-use-shared-deps.patch\n\ncd ${WORKSPACE}/srcdir/fmusim\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/test-fixtures-dev-dependency.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/cargo-lock-local-fmi-rs.patch\n\nexport CFLAGS=\"-I${includedir}/libxml2\"\n# On Windows the import libraries are in ${prefix}/lib, not ${libdir}.\nexport RUSTFLAGS=\"-L ${prefix}/lib\"\nif [[ \"${target}\" == *-mingw* ]]; then\n    # crash-handler calls _invoke_watson, which mingw-w64 v11 lacks for msvcrt.dll.\n    ${CC} -c ${WORKSPACE}/srcdir/invoke_watson.c -o ${WORKSPACE}/srcdir/invoke_watson.o\n    export RUSTFLAGS=\"${RUSTFLAGS} -C link-arg=${WORKSPACE}/srcdir/invoke_watson.o\"\nfi\ncargo build --release --locked --config \"patch.crates-io.fmi-rs.path='${WORKSPACE}/srcdir/fmi-rs/fmi-rs'\"\n\ninstall -Dvm 755 \"target/${rust_target}/release/fmusim${exeext}\" \"${bindir}/fmusim${exeext}\"\ninstall_license LICENSE\n"""
toplevel_block = ""
version = "v0.16.0"

[build_options]
compilers = "[:c, :rust]"
compression_format = "\"gzip\""
preferred_gcc_version = "v\"9.0.0\""

[[dependencies]]
build_version = "7.4.0"
compat = "7.4"
name = "Sundials_jll"
platforms = ["any"]
top_level = false
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0
[[dependencies]]
build_version = "2.15.3"
compat = "2.15.3"
name = "XML2_jll"
platforms = ["any"]
top_level = false
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
binnames = ["fmusim"]
type = "exe"
variable_name = "fmusim"

