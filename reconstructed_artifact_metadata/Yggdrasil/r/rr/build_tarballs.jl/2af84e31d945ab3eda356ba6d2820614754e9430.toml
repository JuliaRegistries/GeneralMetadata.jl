name = "rr"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11"]
script = """cd ${WORKSPACE}/srcdir/rr/\n\n# Don't require ARMv8.3 of the host running rr\nsed -i 's/-march=armv8.3-a //' CMakeLists.txt\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/aarch64-xpac-without-armv8.3.patch\natomic_patch -p1 ${WORKSPACE}/srcdir/patches/x86_64-syscall-cancel-arch-hook.patch\n\nmkdir build && cd build\nPKG_CONFIG_LIBDIR=/workspace/destdir/lib/pkgconfig \\\ncmake -GNinja -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -Ddisable32bit=ON -DBUILD_TESTS=OFF -DWILL_RUN_TESTS=OFF -Dstaticlibs=ON ..\nninja -j${nproc}\nninja install\n"""
toplevel_block = ""
version = "v5.10.0"

