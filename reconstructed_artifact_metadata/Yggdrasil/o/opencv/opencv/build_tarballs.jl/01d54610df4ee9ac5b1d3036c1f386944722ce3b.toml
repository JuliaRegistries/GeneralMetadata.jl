 "i686-w64-mingw32-cxx11-julia_version+1.13.0", "x86_64-w64-mingw32-cxx11-julia_version+1.13.0"]
script = """macos_sdk_version=14.0\nmacosx_deployment_target=12\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == *-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd ${WORKSPACE}/srcdir\n\nrm -rv opencv_contrib/modules/julia/gen\ncp -rv OpenCV.jl/gen opencv_contrib/modules/julia/gen\ncp -v OpenCV.jl/gen/CMakeLists.txt opencv_contrib/modules/julia/CMakeLists.txt\n\n# Qt 6.10 requires CMake >= 3.22; use CMake_jll from the host prefix\napk del cmake\n\nif [[ \"${target}\" == *-apple-* ]] || [[ \"${target}\" == *-freebsd* ]]; then\n    atomic_patch -p1 -d opencv patches/atomic_fix.patch\nfi\n\nif [[ \"${target}\" == *-w64-* ]]; then\n    export CXXFLAGS=\"-Wa,-mbig-obj\"\nfi\n\nbuild_list=core,imgproc,imgcodecs,highgui,videoio,dnn,features2d,objdetect,calib3d,video,gapi,stitching,julia\ncmake_args=()\n\nif [[ \"${target}\" == *-freebsd* ]]; then\n    # IPP's bundled safestring redeclares memset_s incompatibly with FreeBSD's string.h.\n    cmake_args+=(-DWITH_IPP=OFF)\nfi\n\nif [[ \"${bb_full_target}\" == *cuda+* ]]; then\n    # BinaryBuilder's x86_64 host needs x86_64 CUDA tools, paired with the target C++ compiler.\n    if [[ \"${target}\" == aarch64-* ]]; then\n        export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n        export NVCC_PREPEND_FLAGS=\"-ccbin=${CXX}\"\n        rm -rfv ${prefix}/cuda/bin ${prefix}/cuda/nvvm/bin ${prefix}/cuda/nvvm/lib64\n        cp -a cuda_nvcc-linux-x86_64-*-archive/bin ${prefix}/cuda/bin\n        cp -a libnvvm-linux-x86_64-*-archive/nvvm/{bin,lib64} ${prefix}/cuda/nvvm/\n    fi\n\n    mkdir -pv ${WORKSPACE}/tmpdir\n    export TMPDIR=${WORKSPACE}/tmpdir\n\n    # core refuses to configure with CUDA unless opencv_contrib's cudev is built.\n    build_list+=,cudev\n    # nvcc searches lib64; the SDK uses lib. Vendor libraries require newer glibc symbols.\n    # Keep PTX for the newest architecture so newer GPUs can JIT.\n    cmake_args+=(\n        -DWITH_CUDA=ON\n        -DWITH_CUDNN=ON\n        -DOPENCV_DNN_CUDA=ON\n        -DENABLE_CUDA_FIRST_CLASS_LANGUAGE=ON\n        -DCMAKE_CUDA_COMPILER=${prefix}/cuda/bin/nvcc\n        -DCMAKE_CUDA_FLAGS=\"-L${prefix}/cuda/lib\"\n        -DCMAKE_EXE_LINKER_FLAGS=\"-Wl,--allow-shlib-undefined\"\n        -DCUDAToolkit_ROOT=${prefix}/cuda\n        -DCMAKE_CUDA_ARCHITECTURES=\"75-real;80-real;86-real;89-real;90-real;100-real;120\"\n    )\nfi\n\ncmake -B build \\\n    -DCMAKE_FIND_ROOT_PATH=${prefix} \\\n    -DJulia_PREFIX=${prefix} \\\n    -DWITH_JULIA=ON \\\n    -DJulia_FOUND=ON \\\n    -DHAVE_JULIA=ON \\\n    -DJulia_WORD_SIZE=${nbits} \\\n    -DJulia_INCLUDE_DIRS=${includedir}/julia \\\n    -DJulia_LIBRARY_DIR=${libdir} \\\n    -DJulia_LIBRARY=${libdir}/libjulia.${dlext} \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_TESTS=OFF \\\n    -DBUILD_PERF_TESTS=OFF \\\n    -DBUILD_EXAMPLES=OFF \\\n    -DHAVE_CXX_FVISIBILITY_HIDDEN=OFF \\\n    -DHAVE_CXX_FVISIBILITY_INLINES_HIDDEN=OFF \\\n    -DWITH_KLEIDICV=OFF \\\n    -DWITH_QT=ON \\\n    -DOPENCV_EXTRA_MODULES_PATH=${WORKSPACE}/srcdir/opencv_contrib/modules \\\n    -DBUILD_LIST=${build_list} \\\n    \"${cmake_args[@]}\" \\\n    opencv\ncmake --build build --parallel ${nproc}\ncmake --install build\n\ncp -v build/lib/libopencv_julia.* ${libdir}\n\n# Modified SDK files would otherwise be packaged.\nif [[ \"${bb_full_target}\" == *cuda+* ]] && [[ \"${target}\" == aarch64-* ]]; then\n    rm -rfv ${prefix}/cuda\nfi\n\ninstall_license opencv/{LICENSE,COPYRIGHT}\n"""
