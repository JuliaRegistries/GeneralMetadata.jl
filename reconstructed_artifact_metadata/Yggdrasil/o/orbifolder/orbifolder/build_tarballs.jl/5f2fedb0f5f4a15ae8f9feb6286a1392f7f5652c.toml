name = "OrbiFolder"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11"]
script = """cd $WORKSPACE/srcdir/orbifolder-1.2.1\n\nupdate_configure_scripts\nCPPFLAGS=\"-I${prefix}/include\" LDFLAGS=\"-L${prefix}/lib\" \\\n    ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\n\n# `make install` does not put the binary under ${prefix}; install it and\n# Geometry/ together manually so an executable-relative lookup finds both.\ninstall -Dvm 755 src/orbifolder/orbifolder \"${prefix}/bin/orbifolder\"\ncp -r Geometry \"${prefix}/bin/Geometry\"\n\ninstall_license COPYING\n"""
