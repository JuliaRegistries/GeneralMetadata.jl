augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "NonSUSYOrbiFolder"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11"]
script = """cd $WORKSPACE/srcdir/nonSUSYorbifolder\n\n# configure.ac calls AX_PATH_GSL, normally provided by autoconf-archive; ship it directly\ncp \"${WORKSPACE}/srcdir/m4/ax_path_gsl.m4\" m4/\n\nautoreconf -fi\n\nCPPFLAGS=\"-I${prefix}/include\" LDFLAGS=\"-L${prefix}/lib\" \\\n    ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target}\nmake -j${nproc}\n\n# `nonSUSYorbifolder` is noinst_PROGRAMS; install it and Geometry/ together\n# manually so an executable-relative lookup finds both.\ninstall -Dvm 755 nonSUSYorbifolder \"${prefix}/bin/nonSUSYorbifolder\"\ncp -r Geometry \"${prefix}/bin/Geometry\"\n\ninstall_license COPYING\n"""
toplevel_block = ""
version = "v1.0.0"

