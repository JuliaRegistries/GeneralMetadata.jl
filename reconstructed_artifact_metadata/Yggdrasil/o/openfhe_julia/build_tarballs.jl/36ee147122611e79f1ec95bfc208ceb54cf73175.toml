name = "openfhe_julia"
platforms = ["x86_64-linux-gnu-cxx11-julia_version+1.10.0", "aarch64-linux-gnu-cxx11-julia_version+1.10.0", "x86_64-apple-darwin-julia_version+1.10.0", "aarch64-apple-darwin-julia_version+1.10.0", "x86_64-unknown-freebsd-julia_version+1.10.0", "x86_64-w64-mingw32-cxx11-julia_version+1.10.0", "x86_64-linux-gnu-cxx11-julia_version+1.11.1", "aarch64-linux-gnu-cxx11-julia_version+1.11.1", "x86_64-apple-darwin-julia_version+1.11.1", "aarch64-apple-darwin-julia_version+1.11.1", "x86_64-unknown-freebsd-julia_version+1.11.1", "x86_64-w64-mingw32-cxx11-julia_version+1.11.1", "x86_64-linux-gnu-cxx11-julia_version+1.12.0", "aarch64-linux-gnu-cxx11-julia_version+1.12.0", "x86_64-apple-darwin-julia_version+1.12.0", "aarch64-apple-darwin-julia_version+1.12.0", "x86_64-unknown-freebsd-julia_version+1.12.0", "x86_64-w64-mingw32-cxx11-julia_version+1.12.0", "x86_64-linux-gnu-cxx11-julia_version+1.13.0", "aarch64-linux-gnu-cxx11-julia_version+1.13.0", "x86_64-apple-darwin-julia_version+1.13.0", "aarch64-apple-darwin-julia_version+1.13.0", "x86_64-unknown-freebsd-julia_version+1.13.0", "x86_64-w64-mingw32-cxx11-julia_version+1.13.0"]
script = """macos_sdk_version=10.15\nmacosx_deployment_target=10.15\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd $WORKSPACE/srcdir/openfhe-julia/\n\nif [[ \"${target}\" == *-mingw* ]]; then\n    # This is needed because otherwise we get unusable binaries (error \"The specified\n    # executable is not a valid application for this OS platform\"). These come from\n    # CompilerSupportLibraries_jll.\n    # xref: https://github.com/JuliaPackaging/Yggdrasil/issues/7904\n    #\n    # The remove path pattern matches `lib/gcc/<triple>/<major>/`, where `<triple>` is the\n    # platform triplet and `<major>` is the GCC major version with which CSL was built\n    # xref: https://github.com/JuliaPackaging/Yggdrasil/pull/7535\n    #\n    # However, before CSL v1.1, these files were located in just `lib/`, thus we clean this\n    # directory as well.\n    if test -n \"$(find $prefix/lib/gcc/*mingw*/*/libgcc*)\"; then\n        rm $prefix/lib/gcc/*mingw*/*/libgcc* $prefix/lib/gcc/*mingw*/*/libmsvcrt*\n    elif test -n \"$(find $prefix/lib/libgcc*)\"; then\n        rm $prefix/lib/libgcc* $prefix/lib/libmsvcrt*\n    else\n        echo \"Could not find any libraries to remove :-/\"\n        find $prefix/lib\n    fi\nfi\n\nif [[ \"$target\" == *-apple-darwin* ]]; then\n    # Link libc++abi to resolve typeid(__int128), see https://github.com/llvm/llvm-project/issues/119608\n    export LDFLAGS=\"-lc++abi\"\n\n    # OpenFHE's CMake config populates the build system with wrong path info for OpenMP\n    export LDFLAGS=\"$LDFLAGS -L$libdir\"\n    sed -i \"s|\\${OPENMP_INCLUDES}|\\$ENV{includedir}|\" CMakeLists.txt\n    sed -i \"s|\\${OPENMP_LIBRARIES}|\\$ENV{libdir}|\" CMakeLists.txt\nfi\n\nmkdir build && cd build\n\ncmake .. \\\n-DCMAKE_INSTALL_PREFIX=$prefix \\\n-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n-DCMAKE_BUILD_TYPE=Release \\\n-DJulia_PREFIX=$prefix \n\nmake -j${nproc}\nmake install\n"""
toplevel_block = ""
