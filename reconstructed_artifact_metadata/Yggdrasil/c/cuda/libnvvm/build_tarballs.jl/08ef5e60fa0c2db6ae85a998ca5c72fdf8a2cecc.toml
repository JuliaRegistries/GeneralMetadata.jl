name = "libNVVM"
platforms = ["x86_64-linux-gnu-cuda+13", "aarch64-linux-gnu-cuda+13", "x86_64-w64-mingw32-cuda+13"]
script = """cd ${WORKSPACE}/srcdir/libnvvm-*\ninstall_license LICENSE\n\nmkdir -p ${bindir} ${libdir} ${prefix}/include ${prefix}/share\nif [[ ${target} == *-linux-gnu ]]; then\n    mv nvvm/lib64/libnvvm.so* ${libdir}\nelif [[ ${target} == x86_64-w64-mingw32 ]]; then\n    mv nvvm/bin/x64/nvvm64_*.dll ${bindir}\n    chmod +x ${bindir}/*.dll\nfi\nmv nvvm/include/* ${prefix}/include/\nmv nvvm/libdevice ${prefix}/share/\n"""
toplevel_block = ""
version = "v4.0.9"

[build_options]
compression_format = "\"gzip\""

