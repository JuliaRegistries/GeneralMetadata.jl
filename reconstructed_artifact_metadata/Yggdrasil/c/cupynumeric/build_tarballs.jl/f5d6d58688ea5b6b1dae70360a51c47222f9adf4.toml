augment_platform_block = """using Base.BinaryPlatforms\n\ntry\n    using CUDA_Runtime_jll\ncatch\n    # during initial package installation, CUDA_Runtime_jll may not be available.\nend\n\n# every other tag that artifacts are selected on must be set before calling this\nfunction augment_cuda_tag!(platform::Platform)\n    if @isdefined(CUDA_Runtime_jll) && isdefined(CUDA_Runtime_jll, :augment_dependent!)\n        # both Pkg and the JLL module include this file from the JLL's `.pkg` directory\n        artifacts_toml = joinpath(@__DIR__, \"..\", \"Artifacts.toml\")\n        CUDA_Runtime_jll.augment_dependent!(platform, artifacts_toml)\n    elseif !haskey(platform, \"cuda\")\n        # CUDA_Runtime_jll is missing during initial installation, or briefly older than\n        # our compat bound while Pkg changes the environment. select the CPU build, if\n        # any; without the tag, Pkg would select any build.\n        platform[\"cuda\"] = \"none\"\n    end\n    return platform\nend\n\nfunction augment_platform!(platform::Platform)\n    augment_cuda_tag!(platform)\nend"""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = true
name = "cupynumeric"
platforms = ["x86_64-linux-gnu-cxx11-cuda+none", "x86_64-linux-gnu-cxx11-cuda+13.0"]
script = ["""\n    # Build crashes without this\n    export TMPDIR=${WORKSPACE}/tmpdir\n    mkdir -p ${TMPDIR}\n\n    # Put new CMake first on path\n    export PATH=${host_bindir}:$PATH\n\n    ln -s ${CUDA_HOME}/lib ${CUDA_HOME}/lib64\n\n    ## BUILD TBLIS ##\n    cd ${WORKSPACE}/srcdir/tblis\n\n    for i in ./Makefile.* ./configure*; do\n\n        # Building in container forbids -march options\n        sed -i \"s/-march[^ ]*//g\" $i\n\n    done\n\n    case ${target} in\n        *\"x86_64\"*\"linux\"*\"gnu\"*) \n            export BLI_CONFIG=x86,reference\n            ;;\n        *\"aarch64\"*)\n            ;;\n        *)\n            ;;\n    esac\n\n    ./configure \\\n        --prefix=$prefix \\\n        --build=${MACHTYPE} \\\n        --host=${target} \\\n        --with-label-type=int32_t \\\n        --with-length-type=int64_t \\\n        --with-stride-type=int64_t \\\n        --enable-thread-model=openmp \\\n        --enable-config=${BLI_CONFIG}\n\n    make -j ${nproc} && make install\n\n    cd ${WORKSPACE}/srcdir/cupynumeric\n\n    # Map the FFT output in C order; the GPU kernel asserts a dense row-major instance.\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/fft-output-c-order.patch\n\n    mkdir build\n    cmake -S . -B build \\\n        -Dlegate_ROOT:STRING=${prefix} \\\n        -DCMAKE_PREFIX_PATH=${prefix} \\\n        -DCMAKE_INSTALL_PREFIX=${prefix} \\\n        -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n        -DCMAKE_BUILD_TYPE=Release \\\n        -DBLAS_LIBRARIES=${libdir}/libopenblas.so \\\n\n    cmake --build build --parallel ${nproc} --verbose\n    cmake --install build\n\n    install_license $WORKSPACE/srcdir/cupynumeric*/LICENSE\n""", """\n    # Build crashes without this\n    export TMPDIR=${WORKSPACE}/tmpdir\n    mkdir -p ${TMPDIR}\n\n    # Put new CMake first on path\n    export PATH=${host_bindir}:$PATH\n\n    # Copy cuTensor Things\n    # Remove static libraries to prevent them being bundled. We do not need.\n    cd ${WORKSPACE}/srcdir/libcutensor*\n    rm -rf lib/*.a\n    cp -av lib/* ${libdir}/\n    cp -av include/* ${includedir}/\n\n    # Necessary operations to cross compile CUDA from x86_64 to aarch64\n    if [[ \"${target}\" == aarch64-linux-* ]]; then\n\n        # Add /usr/lib/csl-musl-x86_64 to LD_LIBRARY_PATH to be able to use host nvcc\n        export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n        \n        # Make sure we use host CUDA executable by copying from the x86_64 CUDA redist\n        NVCC_DIR=(/workspace/srcdir/cuda_nvcc-*-archive)\n        rm -rf ${prefix}/cuda/bin\n        cp -r ${NVCC_DIR}/bin ${prefix}/cuda/bin\n        \n        rm -rf ${prefix}/cuda/nvvm/bin\n        cp -r ${NVCC_DIR}/nvvm/bin ${prefix}/cuda/nvvm/bin\n\n        export NVCC_PREPEND_FLAGS=\"-ccbin='${CXX}'\"\n    fi\n\n    export CUDA_HOME=${prefix}/cuda;\n    export PATH=$PATH:$CUDA_HOME/bin\n    export CUDACXX=$CUDA_HOME/bin/nvcc\n\n    ln -s ${CUDA_HOME}/lib ${CUDA_HOME}/lib64\n    \n\n    ## BUILD TBLIS ##\n    cd ${WORKSPACE}/srcdir/tblis\n\n    for i in ./Makefile.* ./configure*; do\n\n        # Building in container forbids -march options\n        sed -i \"s/-march[^ ]*//g\" $i\n\n    done\n\n    case ${target} in\n        *\"x86_64\"*\"linux\"*\"gnu\"*) \n            export BLI_CONFIG=x86,reference\n            ;;\n        *\"aarch64\"*)\n            ;;\n        *)\n            ;;\n    esac\n\n    ./configure \\\n        --prefix=$prefix \\\n        --build=${MACHTYPE} \\\n        --host=${target} \\\n        --with-label-type=int32_t \\\n        --with-length-type=int64_t \\\n        --with-stride-type=int64_t \\\n        --enable-thread-model=openmp \\\n        --enable-config=${BLI_CONFIG}\n\n    make -j ${nproc} && make install\n\n    ## Install cuPyNumeric ##\n    cd ${WORKSPACE}/srcdir/cupynumeric\n\n    # Map the FFT output in C order; the GPU kernel asserts a dense row-major instance.\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/fft-output-c-order.patch\n    # Order the first cuFFT execution after cuFFT's plan initialization copies on the legacy stream.\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/cupynumeric-fft-plan-ready.patch\n    # Truncate MRG32k3a subsequences to 51 bits so Realm processor IDs stay in the skip-ahead tables.\n    atomic_patch -p1 ${WORKSPACE}/srcdir/patches/cupynumeric-mrg-subsequence.patch\n\n    mkdir build\n    cmake -S . -B build \\\n        -Dlegate_ROOT:STRING=${prefix} \\\n        -DCMAKE_PREFIX_PATH=${prefix} \\\n        -DCMAKE_INSTALL_PREFIX=${prefix} \\\n        -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n        -DCMAKE_BUILD_TYPE=Release \\\n        -DNCCL_LIBRARY=${libdir}/libnccl.so \\\n        -DNCCL_INCLUDE_DIR=${includedir} \\\n        -Dcutensor_LIBRARY=${libdir}/libcutensor.so \\\n        -Dcutensor_INCLUDE_DIR=${includedir} \\\n        -DBLAS_LIBRARIES=${libdir}/libopenblas.so \\\n        -DCUSOLVERMP_LIBRARY=${libdir}/libcusolverMp.so \\\n        -DCUSOLVERMP_INCLUDE_DIR=${includedir} \\\n        -Dcupynumeric_USE_CUSOLVERMP=1 \\\n        -DCMAKE_CUDA_ARCHITECTURES=\"75;80;86;89;90;100;103;120;121\"\n        \n\n    cmake --build build --parallel ${nproc} --verbose\n    cmake --install build\n\n    install_license $WORKSPACE/srcdir/cupynumeric*/LICENSE\n\n    mkdir -vp \"${includedir}/cupynumeric/cuda\"\n    cp -v ${CUDA_HOME}/include/cuda.h ${includedir}/cupynumeric/cuda/cuda.h\n"""]
