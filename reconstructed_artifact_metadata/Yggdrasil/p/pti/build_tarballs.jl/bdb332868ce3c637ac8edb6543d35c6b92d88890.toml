augment_platform_block = ""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "PTI"
platforms = ["x86_64-linux-gnu-cxx11"]
script = """cd ${WORKSPACE}/srcdir/pti-gpu/sdk\ncmake -B build \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DPTI_BUILD_SAMPLES=OFF \\\n      -DPTI_BUILD_TESTING=OFF \\\n      -DPTI_BUILD_URGEMM=OFF \\\n      -DFETCHCONTENT_FULLY_DISCONNECTED=ON \\\n      -DFETCHCONTENT_SOURCE_DIR_FMT=${WORKSPACE}/srcdir/fmt \\\n      -DFETCHCONTENT_SOURCE_DIR_SPDLOG=${WORKSPACE}/srcdir/spdlog \\\n      -DFETCHCONTENT_SOURCE_DIR_ITTAPI=${WORKSPACE}/srcdir/ittapi\ncmake --build build --parallel ${nproc}\ncmake --install build\ninstall_license ${WORKSPACE}/srcdir/pti-gpu/LICENSE\ninstall -Dvm 644 ${WORKSPACE}/srcdir/fmt/LICENSE ${prefix}/share/licenses/PTI/LICENSE.fmt\ninstall -Dvm 644 ${WORKSPACE}/srcdir/spdlog/LICENSE ${prefix}/share/licenses/PTI/LICENSE.spdlog\nfor license in ${WORKSPACE}/srcdir/ittapi/LICENSES/*; do\n    install -Dvm 644 ${license} ${prefix}/share/licenses/PTI/ittapi-$(basename ${license})\ndone\n\n# PTI calls the buffer callbacks from its own threads; see the source file\n${CC} -O2 -shared -fPIC -o ${libdir}/libpti_buffers.${dlext} \\\n      ${WORKSPACE}/srcdir/pti_buffers.c -lpthread\n"""
toplevel_block = ""
version = "v1.2.0"

[build_options]
compression_format = "\"gzip\""
preferred_gcc_version = "v\"10.0.0\""

