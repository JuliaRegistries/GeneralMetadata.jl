augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "PFFFT"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd $WORKSPACE/srcdir/pffft\n# On RISC-V the build adds -march=rv64gcv (the vector extension) by itself, which BinaryBuilder\n# does not allow: build for the platform's baseline instead, as on every other target.\n# https://github.com/marton78/pffft/issues/120\nsed -i 's/if (CMAKE_SYSTEM_PROCESSOR MATCHES \"riscv64\")/if (FALSE)/' cmake/target_optimizations.cmake\ncmake -B build \\\n    -DCMAKE_INSTALL_PREFIX=${prefix} \\\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN} \\\n    -DCMAKE_BUILD_TYPE=Release \\\n    -DBUILD_SHARED_LIBS=ON \\\n    -DPFFFT_BUILD_TESTS=OFF \\\n    -DPFFFT_BUILD_BENCHMARKS=OFF \\\n    -DPFFFT_BUILD_EXAMPLES=OFF\n# Only libpffft is shipped. The C++ PFDSP library, built by default, fails on x86 musl,\n# where GCC 4.8.5's mm_malloc.h clashes with musl's posix_memalign\ncmake --build build --parallel ${nproc} --target PFFFT\ncmake --install build\n# The install rule has no RUNTIME destination, so on Windows the DLL itself is not installed\n# https://github.com/marton78/pffft/issues/119\nif [[ \"${target}\" == *-mingw* ]]; then\n    install -Dvm 755 build/libpffft.dll \"${libdir}/libpffft.dll\"\nfi\ninstall_license LICENSE.txt\n"""
toplevel_block = ""
version = "v1.3.1"

[build_options]
compression_format = "\"gzip\""

[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libpffft"]
type = "lib"
variable_name = "libpffft"

