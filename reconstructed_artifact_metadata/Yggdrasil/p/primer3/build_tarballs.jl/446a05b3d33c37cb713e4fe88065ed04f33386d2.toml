julia_compat = "1.6"
lazy_artifacts = false
name = "primer3"
platforms = ["i686-w64-mingw32", "x86_64-w64-mingw32", "i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """cd ${WORKSPACE}/srcdir/primer3/src\nif [[ \"${target}\" == *-mingw* ]]; then\n    # Selects the `.exe` names and drops primer3_masker, which needs mmap(2)\n    TESTOPTS=\"--windows\"\nfi\nmake -j${nproc} CC=\"${CC}\" CXX=\"${CXX}\" TESTOPTS=\"${TESTOPTS}\"\nfor exe in primer3_core ntdpal ntthal oligotm amplicon3_core; do\n    install -Dvm 755 \"${exe}${exeext}\" \"${bindir}/${exe}${exeext}\"\ndone\nif [[ \"${target}\" != *-mingw* ]]; then\n    install -Dvm 755 primer3_masker \"${bindir}/primer3_masker\"\nfi\ninstall_license LICENSE LICENSE_GPL3_for_Amplicon3\n"""
