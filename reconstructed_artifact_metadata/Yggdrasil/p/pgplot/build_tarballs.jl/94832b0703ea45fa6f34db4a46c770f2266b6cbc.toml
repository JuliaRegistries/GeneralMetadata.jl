augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "PGPLOT"
platforms = ["x86_64-linux-musl-libgfortran3", "x86_64-linux-musl-libgfortran4", "x86_64-linux-musl-libgfortran5", "x86_64-linux-gnu-libgfortran3", "x86_64-linux-gnu-libgfortran4", "x86_64-linux-gnu-libgfortran5", "i686-linux-gnu-libgfortran3", "i686-linux-gnu-libgfortran4", "i686-linux-gnu-libgfortran5", "aarch64-apple-darwin-libgfortran5"]
script = """cd $WORKSPACE/srcdir\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    pushd pgplot\n    for f in ../patch-*; do\n        atomic_patch -p0 \"${f}\"\n    done\n    mkdir sys_darwin\n    cp ../bb.conf ./sys_darwin/bb.conf\n    popd\nfi\n\nmkdir pgplot_build && cd pgplot_build/\ncat ../pgplot/drivers.list | sed 's|! PSDRIV|  PSDRIV|g' | sed 's|! GIDRIV|  GIDRIV|g' | sed 's|! PNG|  PNG|g' > drivers.list\n\nif [[ \"${target}\" == *-apple-* ]]; then\n    ../pgplot/makemake ../pgplot/ darwin\n    make lib SHELL=/bin/bash\nelse\n    ../pgplot/makemake ../pgplot/ linux g77_gcc\n    sed -i 's|FCOMPL=g77|FCOMPL=gfortran|' makefile\n    make lib SHARED_LD=\"${FC} -shared  -o libpgplot.${dlext}\"\nfi\n\ninstall -Dvm 755 libpgplot.${dlext} \"${libdir}/libpgplot.${dlext}\"\ninstall_license ../pgplot/copyright.notice\n"""
version = "v5.2.2"

