name = "pandoc"
platforms = ["x86_64-linux-gnu", "x86_64-apple-darwin", "x86_64-w64-mingw32", "aarch64-linux-gnu", "aarch64-apple-darwin"]
script = """cd ${WORKSPACE}/srcdir/\nmkdir -p \"${bindir}\"\nif [[ \"${target}\" != *-mingw* ]]; then\n    subdir=\"bin/\"\nfi\ncp ${target}/pandoc-*/${subdir}pandoc${exeext} ${bindir}\nchmod +x ${bindir}/*\ninstall_license COPYRIGHT\ninstall_license COPYING.md\n"""
toplevel_block = ""
version = "v3.14.0"

[build_options]
compression_format = "\"gzip\""

[[products]]
binnames = ["pandoc"]
type = "exe"
variable_name = "pandoc"

