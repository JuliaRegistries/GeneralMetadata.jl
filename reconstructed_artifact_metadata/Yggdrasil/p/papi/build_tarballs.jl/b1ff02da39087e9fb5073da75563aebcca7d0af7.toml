augment_platform_block = """using Base.BinaryPlatforms\n\ntry\n    using CUDA_Runtime_jll\ncatch\n    # during initial package installation, CUDA_Runtime_jll may not be available.\nend\n\n# every other tag that artifacts are selected on must be set before calling this\nfunction augment_cuda_tag!(platform::Platform)\n    if @isdefined(CUDA_Runtime_jll) && isdefined(CUDA_Runtime_jll, :augment_dependent!)\n        # both Pkg and the JLL module include this file from the JLL's `.pkg` directory\n        artifacts_toml = joinpath(@__DIR__, \"..\", \"Artifacts.toml\")\n        CUDA_Runtime_jll.augment_dependent!(platform, artifacts_toml)\n    elseif !haskey(platform, \"cuda\")\n        # CUDA_Runtime_jll is missing during initial installation, or briefly older than\n        # our compat bound while Pkg changes the environment. select the CPU build, if\n        # any; without the tag, Pkg would select any build.\n        platform[\"cuda\"] = \"none\"\n    end\n    return platform\nend\n\nfunction augment_platform!(platform::Platform)\n    augment_cuda_tag!(platform)\nend"""
init_block = ""
julia_compat = "1.10"
lazy_artifacts = true
name = "PAPI"
platforms = ["i686-linux-gnu-cuda+none", "x86_64-linux-gnu-cuda+none", "aarch64-linux-gnu-cuda+none", "armv6l-linux-gnueabihf-cuda+none", "armv7l-linux-gnueabihf-cuda+none", "powerpc64le-linux-gnu-cuda+none", "i686-linux-musl-cuda+none", "x86_64-linux-musl-cuda+none", "aarch64-linux-musl-cuda+none", "armv6l-linux-musleabihf-cuda+none", "armv7l-linux-musleabihf-cuda+none", "x86_64-linux-gnu-cuda+11.4", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+11.4", "x86_64-linux-gnu-cuda+11.5", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+11.5", "x86_64-linux-gnu-cuda+11.6", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+11.6", "x86_64-linux-gnu-cuda+11.7", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+11.7", "x86_64-linux-gnu-cuda+11.8", "aarch64-linux-gnu-cuda_platform+jetson-cuda+11.8", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+11.8", "x86_64-linux-gnu-cuda+12.0", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12.0", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.0", "x86_64-linux-gnu-cuda+12.1", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12.1", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.1", "x86_64-linux-gnu-cuda+12.2", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12.2", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.2", "x86_64-linux-gnu-cuda+12.3", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.3"]
script = """cd $WORKSPACE/srcdir/papi\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\ncd src\nif [[ \"${target}\" == *-musl* ]]; then\n    CFLAGS=\"-D_GNU_SOURCE\"\nfi\n\nCOMPONENTS=()\nif [[ -d \"${prefix}/cuda\" ]]; then\n    COMPONENTS+=(cuda)\n    export PAPI_CUDA_ROOT=\"${prefix}/cuda\"\nfi\n\nif [[ ${target} == powerpc64le-* ]]; then\n  CPU=POWER8\nelif [[ ${target} == x86_64-* || ${target} == i686-* ]]; then\n  CPU=x86\nelse\n  CPU=arm\nfi\n\necho \"Building components: ${COMPONENTS[@]}\"\nexport CFLAGS\nbash ./configure --prefix=${prefix} --build=${MACHTYPE} --host=${target} \\\n    --with-ffsll \\\n    --with-perf-events \\\n    --with-walltimer=gettimeofday \\\n    --with-tls=__thread \\\n    --with-virtualtimer=times \\\n    --with-shared-lib \\\n    --with-nativecc=${CC_FOR_BUILD} \\\n    --with-components=\"${COMPONENTS[@]}\" \\\n    --with-CPU=\"${CPU}\"\n\nmake -j ${nproc}\nmake install\n"""
toplevel_block = ""
