augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "Thrift"
platforms = ["i686-linux-gnu-cxx11", "x86_64-linux-gnu-cxx11", "aarch64-linux-gnu-cxx11", "armv6l-linux-gnueabihf-cxx11", "armv7l-linux-gnueabihf-cxx11", "powerpc64le-linux-gnu-cxx11", "riscv64-linux-gnu-cxx11", "i686-linux-musl-cxx11", "x86_64-linux-musl-cxx11", "aarch64-linux-musl-cxx11", "armv6l-linux-musleabihf-cxx11", "armv7l-linux-musleabihf-cxx11", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32-cxx11", "x86_64-w64-mingw32-cxx11"]
script = """cd $WORKSPACE/srcdir/thrift\n\nCMAKE_FLAGS=(\n    -DCMAKE_INSTALL_PREFIX=${prefix}\n    -DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN}\n    -DCMAKE_BUILD_TYPE=Release\n    -DBUILD_COMPILER=ON\n    -DBUILD_CPP=ON\n    -DBUILD_PYTHON=OFF\n    -DBUILD_TESTING=OFF\n    -DBUILD_JAVASCRIPT=OFF\n    -DBUILD_NODEJS=OFF\n    -DBUILD_SHARED_LIBS=ON\n    -DBUILD_TUTORIALS=OFF\n    -DTHRIFT_COMPILER_DELPHI=OFF\n)\n\nif [[ ${target} == *darwin* || ${target} == *freebsd* ]]; then\n    CMAKE_FLAGS+=(\n        # Avoid a problem in Boost by disabling a Clang compiler \"warning\" that is actually treated as error\n        -DCMAKE_CXX_FLAGS='-Wno-enum-constexpr-conversion'\n    )\nfi\n\ncmake -B cmake-build \"${CMAKE_FLAGS[@]}\"\ncmake --build cmake-build --parallel ${nproc}\ncmake --install cmake-build\n"""
toplevel_block = ""
version = "v0.25.0"

[build_options]
compression_format = "\"gzip\""
preferred_gcc_version = "v\"7.0.0\""

[[dependencies]]
build_version = "1.87.0"
compat = "=1.87.0"
name = "boost_jll"
platforms = ["any"]
top_level = false
type = "dependency"
version-major = 0
version-minor = 0
version-patch = 0

[[products]]
binnames = ["thrift"]
type = "exe"
variable_name = "thrift"
[[products]]
dir_paths = []
dlopen_flags = []
dont_dlopen = false
libnames = ["libthrift"]
type = "lib"
variable_name = "libthrift"

