augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "spirv2clc"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "i686-w64-mingw32", "x86_64-w64-mingw32"]
script = """cd spirv2clc\ninstall_license LICENSE\n\n# spirv2clc's CMake build requires CMake >= 3.24, newer than the one shipped in\n# the build environment, so use the one provided by CMake_jll (added as a host\n# build dependency below) instead.\napk del cmake\n\n# check-out vendored submodules (OpenCL-Headers, SPIRV-Headers, SPIRV-Tools)\n# under external/. SPIRV-Tools is built from source because spirv2clc links\n# against its internal optimizer API.\n# TODO: use JLLs?\ngit submodule update --init --recursive\n\nCMAKE_FLAGS=()\n\n# Release build for best performance\nCMAKE_FLAGS+=(-DCMAKE_BUILD_TYPE=Release)\n\n# Install things into $prefix\nCMAKE_FLAGS+=(-DCMAKE_INSTALL_PREFIX=${prefix})\n\n# Explicitly use our cmake toolchain file\nCMAKE_FLAGS+=(-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TARGET_TOOLCHAIN})\n\n# We already initialised the submodules above, so don't let CMake do it again.\nCMAKE_FLAGS+=(-DSPIRV2CLC_UPDATE_SUBMODULES=OFF)\n\n# We don't run the (lit/clang/FileCheck-based) regression tests nor the\n# OpenCL test layer here, so skip configuring/building them entirely.\nCMAKE_FLAGS+=(-DBUILD_TESTING=OFF)\n\ncmake -B build -S . -GNinja ${CMAKE_FLAGS[@]}\nninja -C build -j ${nproc} spirv2clc libspirv2clc-c\n\n# Install the command-line translator (`tools`) and the shared library with the\n# C API and its header (`c_api`). The build also produces a static library with\n# a C++ API and vendored SPIR-V/OpenCL headers, which are of no use in a JLL.\ncmake --install build --component tools\ncmake --install build --component c_api\n"""
toplevel_block = ""
version = "v0.2.6"

