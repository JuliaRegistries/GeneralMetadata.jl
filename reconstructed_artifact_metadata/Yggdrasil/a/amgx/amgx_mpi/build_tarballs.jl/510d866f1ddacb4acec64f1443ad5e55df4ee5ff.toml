platforms = ["x86_64-linux-gnu-mpi+mpitrampoline-cuda+12.0", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+jetson-cuda+12.0", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+sbsa-cuda+12.0", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+12.1", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+jetson-cuda+12.1", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+sbsa-cuda+12.1", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+12.2", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+jetson-cuda+12.2", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+sbsa-cuda+12.2", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+12.3", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+sbsa-cuda+12.3", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+12.4", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+jetson-cuda+12.4", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+sbsa-cuda+12.4", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+12.5", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+jetson-cuda+12.5", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+sbsa-cuda+12.5", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+12.6", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+jetson-cuda+12.6", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+sbsa-cuda+12.6", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+12.8", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+jetson-cuda+12.8", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+sbsa-cuda+12.8", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+12.9", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+jetson-cuda+12.9", "aarch64-linux-gnu-mpi+mpitrampoline-cuda_platform+sbsa-cuda+12.9", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+13.0", "aarch64-linux-gnu-mpi+mpitrampoline-cuda+13.0", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+13.1", "aarch64-linux-gnu-mpi+mpitrampoline-cuda+13.1", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+13.2", "aarch64-linux-gnu-mpi+mpitrampoline-cuda+13.2", "x86_64-linux-gnu-mpi+mpitrampoline-cuda+13.3", "aarch64-linux-gnu-mpi+mpitrampoline-cuda+13.3"]
script = ["""CUDA_ARCHS=\"75;80;86;89;90\"\n# nvcc writes to /tmp, which is a small tmpfs in our sandbox.\n# make it use the workspace instead\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir ${TMPDIR}\n\n# nvcc is not a cross compiler, but it does run on the build host and can be\n# pointed at a cross C++ compiler. The CUDA SDK we get is the target's, so for\n# aarch64 we swap in the host x86_64 nvcc (and nvvm, split into its own redist\n# from CUDA 13) and tell it to use the cross compiler for host code.\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n\n    NVCC_DIR=(${WORKSPACE}/srcdir/cuda_nvcc-linux-x86_64-*-archive)\n    NVVM_DIR=(${WORKSPACE}/srcdir/libnvvm-linux-x86_64-*-archive)\n\n    rm -rf ${prefix}/cuda/bin\n    cp -a \"${NVCC_DIR[0]}/bin\" \"${prefix}/cuda/bin\"\n\n    if [[ -d \"${NVCC_DIR[0]}/nvvm/bin\" ]]; then\n        rm -rf ${prefix}/cuda/nvvm/bin\n        cp -a \"${NVCC_DIR[0]}/nvvm/bin\" \"${prefix}/cuda/nvvm/bin\"\n        [[ -d \"${NVCC_DIR[0]}/nvvm/lib64\" ]] && { rm -rf ${prefix}/cuda/nvvm/lib64; cp -a \"${NVCC_DIR[0]}/nvvm/lib64\" \"${prefix}/cuda/nvvm/lib64\"; }\n    elif [[ -d \"${NVVM_DIR[0]}/nvvm/bin\" ]]; then\n        rm -rf ${prefix}/cuda/nvvm/bin\n        cp -a \"${NVVM_DIR[0]}/nvvm/bin\" \"${prefix}/cuda/nvvm/bin\"\n        [[ -d \"${NVVM_DIR[0]}/nvvm/lib64\" ]] && { rm -rf ${prefix}/cuda/nvvm/lib64; cp -a \"${NVVM_DIR[0]}/nvvm/lib64\" \"${prefix}/cuda/nvvm/lib64\"; }\n    else\n        echo \"ERROR: no host x86_64 nvvm found; cannot cross-compile CUDA device code\"\n        exit 1\n    fi\n\n    export NVCC_PREPEND_FLAGS=\"-ccbin=${CXX}\"\nfi\n\ncd ${WORKSPACE}/srcdir/AMGX*\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\ninstall_license LICENSES/BSD-3-Clause.txt\n\nmkdir build\ncd build\n# AMGX enables MPI whenever `find_package(MPI)` succeeds, defining AMGX_WITH_MPI\n# and linking MPI::MPI_CXX. Point it at the MPI from the JLL explicitly so it\n# cannot pick up anything else.\ncmake -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CUDA_COMPILER=$prefix/cuda/bin/nvcc \\\n      -DCMAKE_CUDA_FLAGS=\"-L${prefix}/cuda/lib\" \\\n      -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n      -DMPI_C_COMPILER=${bindir}/mpicc \\\n      -DMPI_CXX_COMPILER=${bindir}/mpicxx \\\n      -Wno-dev \\\n      .. > cmake.log 2>&1 || { cat cmake.log; exit 1; }\ncat cmake.log\n\n# AMGX prints this once `find_package(MPI)` has succeeded and AMGX_WITH_MPI is\n# set. Fail loudly rather than silently shipping a non-MPI build under this name.\ngrep -q \"This is a MPI build:TRUE\" cmake.log || \\\n  { echo \"ERROR: MPI was not detected; refusing to build AMGX_MPI without MPI\"; exit 1; }\n\nmake -j${nproc} install\n\n# clean-up\n## unneeded static libraries\nrm ${libdir}/*.a\n\n## the host x86_64 nvcc we swapped in must not end up in an aarch64 artifact\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    rm -rf ${prefix}/cuda\nfi\n""", """CUDA_ARCHS=\"75;80;86;89;90;100;120\"\n# nvcc writes to /tmp, which is a small tmpfs in our sandbox.\n# make it use the workspace instead\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir ${TMPDIR}\n\n# nvcc is not a cross compiler, but it does run on the build host and can be\n# pointed at a cross C++ compiler. The CUDA SDK we get is the target's, so for\n# aarch64 we swap in the host x86_64 nvcc (and nvvm, split into its own redist\n# from CUDA 13) and tell it to use the cross compiler for host code.\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n\n    NVCC_DIR=(${WORKSPACE}/srcdir/cuda_nvcc-linux-x86_64-*-archive)\n    NVVM_DIR=(${WORKSPACE}/srcdir/libnvvm-linux-x86_64-*-archive)\n\n    rm -rf ${prefix}/cuda/bin\n    cp -a \"${NVCC_DIR[0]}/bin\" \"${prefix}/cuda/bin\"\n\n    if [[ -d \"${NVCC_DIR[0]}/nvvm/bin\" ]]; then\n        rm -rf ${prefix}/cuda/nvvm/bin\n        cp -a \"${NVCC_DIR[0]}/nvvm/bin\" \"${prefix}/cuda/nvvm/bin\"\n        [[ -d \"${NVCC_DIR[0]}/nvvm/lib64\" ]] && { rm -rf ${prefix}/cuda/nvvm/lib64; cp -a \"${NVCC_DIR[0]}/nvvm/lib64\" \"${prefix}/cuda/nvvm/lib64\"; }\n    elif [[ -d \"${NVVM_DIR[0]}/nvvm/bin\" ]]; then\n        rm -rf ${prefix}/cuda/nvvm/bin\n        cp -a \"${NVVM_DIR[0]}/nvvm/bin\" \"${prefix}/cuda/nvvm/bin\"\n        [[ -d \"${NVVM_DIR[0]}/nvvm/lib64\" ]] && { rm -rf ${prefix}/cuda/nvvm/lib64; cp -a \"${NVVM_DIR[0]}/nvvm/lib64\" \"${prefix}/cuda/nvvm/lib64\"; }\n    else\n        echo \"ERROR: no host x86_64 nvvm found; cannot cross-compile CUDA device code\"\n        exit 1\n    fi\n\n    export NVCC_PREPEND_FLAGS=\"-ccbin=${CXX}\"\nfi\n\ncd ${WORKSPACE}/srcdir/AMGX*\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\ninstall_license LICENSES/BSD-3-Clause.txt\n\nmkdir build\ncd build\n# AMGX enables MPI whenever `find_package(MPI)` succeeds, defining AMGX_WITH_MPI\n# and linking MPI::MPI_CXX. Point it at the MPI from the JLL explicitly so it\n# cannot pick up anything else.\ncmake -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CUDA_COMPILER=$prefix/cuda/bin/nvcc \\\n      -DCMAKE_CUDA_FLAGS=\"-L${prefix}/cuda/lib\" \\\n      -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n      -DMPI_C_COMPILER=${bindir}/mpicc \\\n      -DMPI_CXX_COMPILER=${bindir}/mpicxx \\\n      -Wno-dev \\\n      .. > cmake.log 2>&1 || { cat cmake.log; exit 1; }\ncat cmake.log\n\n# AMGX prints this once `find_package(MPI)` has succeeded and AMGX_WITH_MPI is\n# set. Fail loudly rather than silently shipping a non-MPI build under this name.\ngrep -q \"This is a MPI build:TRUE\" cmake.log || \\\n  { echo \"ERROR: MPI was not detected; refusing to build AMGX_MPI without MPI\"; exit 1; }\n\nmake -j${nproc} install\n\n# clean-up\n## unneeded static libraries\nrm ${libdir}/*.a\n\n## the host x86_64 nvcc we swapped in must not end up in an aarch64 artifact\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    rm -rf ${prefix}/cuda\nfi\n"""]
