name = "AMGX_MPI"
platforms = ["x86_64-linux-gnu-cuda+12.0-mpi+mpiabi", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12.0-mpi+mpiabi", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.0-mpi+mpiabi", "x86_64-linux-gnu-cuda+13.0-mpi+mpiabi", "aarch64-linux-gnu-cuda+13.0-mpi+mpiabi", "x86_64-linux-gnu-cuda+12.0-mpi+mpich", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12.0-mpi+mpich", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.0-mpi+mpich", "x86_64-linux-gnu-cuda+13.0-mpi+mpich", "aarch64-linux-gnu-cuda+13.0-mpi+mpich", "x86_64-linux-gnu-cuda+12.0-mpi+mpitrampoline", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12.0-mpi+mpitrampoline", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.0-mpi+mpitrampoline", "x86_64-linux-gnu-cuda+13.0-mpi+mpitrampoline", "aarch64-linux-gnu-cuda+13.0-mpi+mpitrampoline", "x86_64-linux-gnu-cuda+12.0-mpi+openmpi", "aarch64-linux-gnu-cuda_platform+jetson-cuda+12.0-mpi+openmpi", "aarch64-linux-gnu-cuda_platform+sbsa-cuda+12.0-mpi+openmpi", "x86_64-linux-gnu-cuda+13.0-mpi+openmpi", "aarch64-linux-gnu-cuda+13.0-mpi+openmpi"]
script = ["""CUDA_ARCHS=\"75;80;86;89;90\"\n# nvcc writes to /tmp, which is a small tmpfs in the sandbox.\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir -v ${TMPDIR}\n\n# BinaryBuilder's x86_64 host needs x86_64 CUDA tools, paired with the target C++ compiler.\n# nvvm is inside the nvcc archive before CUDA 13, and in its own archive after.\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n    export NVCC_PREPEND_FLAGS=\"-ccbin=${CXX}\"\n    rm -rfv ${prefix}/cuda/bin ${prefix}/cuda/nvvm/bin ${prefix}/cuda/nvvm/lib64\n    cp -a ${WORKSPACE}/srcdir/cuda_nvcc-linux-x86_64-*-archive/bin ${prefix}/cuda/bin\n    cp -a ${WORKSPACE}/srcdir/*-linux-x86_64-*-archive/nvvm/{bin,lib64} ${prefix}/cuda/nvvm/\nfi\n\ncd ${WORKSPACE}/srcdir/AMGX*\n\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 ${f}\ndone\n\ninstall_license LICENSES/BSD-3-Clause.txt\n\n# AMGX enables MPI whenever `find_package(MPI)` succeeds, defining AMGX_WITH_MPI\n# and linking MPI::MPI_CXX. Point it at the MPI from the JLL explicitly so it\n# cannot pick up anything else.\nmpi_args=()\nif [[ ${bb_full_target} == *mpi* ]]; then\n    export MPITRAMPOLINE_CC=${CC} MPITRAMPOLINE_CXX=${CXX}\n    mpi_args=(-DMPI_C_COMPILER=${bindir}/mpicc -DMPI_CXX_COMPILER=${bindir}/mpicxx)\nfi\n\ncmake -B build \\\n      -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CUDA_COMPILER=$prefix/cuda/bin/nvcc \\\n      -DCMAKE_CUDA_FLAGS=\"-L${prefix}/cuda/lib\" \\\n      -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n      \"${mpi_args[@]}\" \\\n      -Wno-dev \\\n      > cmake.log 2>&1 || { cat cmake.log; exit 1; }\ncat cmake.log\n\n# AMGX prints this once `find_package(MPI)` has succeeded and AMGX_WITH_MPI is\n# set. Fail loudly rather than silently shipping a non-MPI build under this name.\nif [[ ${bb_full_target} == *mpi* ]]; then\n    grep -q \"This is a MPI build:TRUE\" cmake.log || \\\n      { echo \"ERROR: MPI was not detected; refusing to build AMGX_MPI without MPI\"; exit 1; }\nfi\n\ncmake --build build --parallel ${nproc}\ncmake --install build\n\nrm -v ${libdir}/*.a\n\n# Modified SDK files would otherwise be packaged.\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    rm -rfv ${prefix}/cuda\nfi\n""", """CUDA_ARCHS=\"75;80;86;89;90;100;120\"\n# nvcc writes to /tmp, which is a small tmpfs in the sandbox.\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir -v ${TMPDIR}\n\n# BinaryBuilder's x86_64 host needs x86_64 CUDA tools, paired with the target C++ compiler.\n# nvvm is inside the nvcc archive before CUDA 13, and in its own archive after.\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    export LD_LIBRARY_PATH=\"/usr/lib/csl-musl-x86_64:/usr/lib/csl-glibc-x86_64:${LD_LIBRARY_PATH}\"\n    export NVCC_PREPEND_FLAGS=\"-ccbin=${CXX}\"\n    rm -rfv ${prefix}/cuda/bin ${prefix}/cuda/nvvm/bin ${prefix}/cuda/nvvm/lib64\n    cp -a ${WORKSPACE}/srcdir/cuda_nvcc-linux-x86_64-*-archive/bin ${prefix}/cuda/bin\n    cp -a ${WORKSPACE}/srcdir/*-linux-x86_64-*-archive/nvvm/{bin,lib64} ${prefix}/cuda/nvvm/\nfi\n\ncd ${WORKSPACE}/srcdir/AMGX*\n\nfor f in ${WORKSPACE}/srcdir/patches/*.patch; do\n    atomic_patch -p1 ${f}\ndone\n\ninstall_license LICENSES/BSD-3-Clause.txt\n\n# AMGX enables MPI whenever `find_package(MPI)` succeeds, defining AMGX_WITH_MPI\n# and linking MPI::MPI_CXX. Point it at the MPI from the JLL explicitly so it\n# cannot pick up anything else.\nmpi_args=()\nif [[ ${bb_full_target} == *mpi* ]]; then\n    export MPITRAMPOLINE_CC=${CC} MPITRAMPOLINE_CXX=${CXX}\n    mpi_args=(-DMPI_C_COMPILER=${bindir}/mpicc -DMPI_CXX_COMPILER=${bindir}/mpicxx)\nfi\n\ncmake -B build \\\n      -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CUDA_COMPILER=$prefix/cuda/bin/nvcc \\\n      -DCMAKE_CUDA_FLAGS=\"-L${prefix}/cuda/lib\" \\\n      -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n      \"${mpi_args[@]}\" \\\n      -Wno-dev \\\n      > cmake.log 2>&1 || { cat cmake.log; exit 1; }\ncat cmake.log\n\n# AMGX prints this once `find_package(MPI)` has succeeded and AMGX_WITH_MPI is\n# set. Fail loudly rather than silently shipping a non-MPI build under this name.\nif [[ ${bb_full_target} == *mpi* ]]; then\n    grep -q \"This is a MPI build:TRUE\" cmake.log || \\\n      { echo \"ERROR: MPI was not detected; refusing to build AMGX_MPI without MPI\"; exit 1; }\nfi\n\ncmake --build build --parallel ${nproc}\ncmake --install build\n\nrm -v ${libdir}/*.a\n\n# Modified SDK files would otherwise be packaged.\nif [[ \"${target}\" == aarch64-linux-* ]]; then\n    rm -rfv ${prefix}/cuda\nfi\n"""]
