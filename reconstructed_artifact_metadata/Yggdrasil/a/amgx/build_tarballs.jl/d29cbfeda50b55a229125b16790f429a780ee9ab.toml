platforms = ["x86_64-linux-gnu-cuda+12.0", "x86_64-linux-gnu-cuda+12.1", "x86_64-linux-gnu-cuda+12.2", "x86_64-linux-gnu-cuda+12.3", "x86_64-linux-gnu-cuda+12.4", "x86_64-linux-gnu-cuda+12.5", "x86_64-linux-gnu-cuda+12.6", "x86_64-linux-gnu-cuda+12.8", "x86_64-linux-gnu-cuda+12.9", "x86_64-linux-gnu-cuda+13.0", "x86_64-linux-gnu-cuda+13.1", "x86_64-linux-gnu-cuda+13.2", "x86_64-linux-gnu-cuda+13.3"]
script = ["""CUDA_ARCHS=\"75;80;86;89;90\"\n# nvcc writes to /tmp, which is a small tmpfs in our sandbox.\n# make it use the workspace instead\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir ${TMPDIR}\n\ncd ${WORKSPACE}/srcdir/AMGX*\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\ninstall_license LICENSES/BSD-3-Clause.txt\n\nmkdir build\ncd build\ncmake -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CUDA_COMPILER=$prefix/cuda/bin/nvcc \\\n      -DCMAKE_CUDA_FLAGS=\"-L${prefix}/cuda/lib\" \\\n      -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n      -Wno-dev \\\n      ..\n\nmake -j${nproc} install\n\n# clean-up\n## unneeded static libraries\nrm ${libdir}/*.a\n""", """CUDA_ARCHS=\"75;80;86;89;90;100;120\"\n# nvcc writes to /tmp, which is a small tmpfs in our sandbox.\n# make it use the workspace instead\nexport TMPDIR=${WORKSPACE}/tmpdir\nmkdir ${TMPDIR}\n\ncd ${WORKSPACE}/srcdir/AMGX*\n\n# Apply all our patches\nif [ -d $WORKSPACE/srcdir/patches ]; then\nfor f in $WORKSPACE/srcdir/patches/*.patch; do\n    echo \"Applying patch ${f}\"\n    atomic_patch -p1 ${f}\ndone\nfi\n\ninstall_license LICENSES/BSD-3-Clause.txt\n\nmkdir build\ncd build\ncmake -DCMAKE_TOOLCHAIN_FILE=\"${CMAKE_TARGET_TOOLCHAIN}\" \\\n      -DCMAKE_INSTALL_PREFIX=${prefix} \\\n      -DCMAKE_BUILD_TYPE=Release \\\n      -DCMAKE_CUDA_COMPILER=$prefix/cuda/bin/nvcc \\\n      -DCMAKE_CUDA_FLAGS=\"-L${prefix}/cuda/lib\" \\\n      -DCMAKE_CUDA_ARCHITECTURES=\"${CUDA_ARCHS}\" \\\n      -Wno-dev \\\n      ..\n\nmake -j${nproc} install\n\n# clean-up\n## unneeded static libraries\nrm ${libdir}/*.a\n"""]
