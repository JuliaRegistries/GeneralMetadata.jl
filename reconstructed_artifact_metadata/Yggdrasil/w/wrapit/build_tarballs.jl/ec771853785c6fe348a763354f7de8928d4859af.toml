augment_platform_block = ""
init_block = ""
julia_compat = "1.6"
lazy_artifacts = false
name = "WrapIt"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "powerpc64le-linux-gnu", "riscv64-linux-gnu", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd"]
script = """macos_sdk_version=10.15\nmacosx_deployment_target=10.15\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\n\n# Search for libcrypto.$dlext which can be in /workspace/destdir/lib ($libdir) or /workspace/destdir/lib64\nif [ -f \"$libdir/libcrypto.$dlext\" ]; then\n  libcrypto_path=\"$libdir/libcrypto.$dlext\"\nelif [ -f \"${libdir}/../lib64/libcrypto.$dlext\" ]; then\n  libcrypto_path=\"${libdir}/../lib64/libcrypto.$dlext\"\nelse\n  echo \"libcrypto.$dlext not found\"\n  exit 1\nfi\n\n######################################################################\n# Build the software\nclang_resource_dir=clang/res\ncd \"$WORKSPACE/srcdir\"\nmkdir build\ncd build/\ncmake -GNinja \\\n-DCMAKE_INSTALL_PREFIX=$prefix \\\n-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TARGET_TOOLCHAIN \\\n-DCMAKE_BUILD_TYPE=Release \\\n-DCLANG_JLL=True \\\n-DOPENSSL_USE_STATIC_LIBS=True \\\n-DCLANG_RESOURCE_DIR=\"$clang_resource_dir\" \\\n-DOPENSSL_ROOT_DIR=\"$prefix\" -DOPENSSL_CRYPTO_LIBRARY=\"${libcrypto_path}\" \\\n../wrapit/\ncmake --build .\ncmake --install .\n#\n######################################################################\n\n######################################################################\n# Install dependencies for the wrapit executable to ship with the tarball\n\n[ \"$dlext\" = dll ] && (cd $prefix/lib && ln -s libLLVM-*.dll.a libLLVM.dll.a )\n\ncd \"$(readlink -f \"$prefix\")\"\nif [ \"${dlext}\" = dylib ]; then\n  clangversiontag=\n  llvmversiontag=\nelse\n  clangversiontag=\".19jl\"\n  llvmversiontag=`echo $clangversiontag | sed 's/^\\./-/'` #.NNjl -> -NNjl\nfi\nclanglib=libclang.$dlext$clangversiontag\nif  [ $clanglib = libclang.so.13jl ] && ! [ -f $libdir/libclang.so.13jl ] && [ -f $libdir/libclang.so.13 ]; then\n   clanglib=libclang.so.13\nfi\nif ! [ -f lib/$clanglib ]; then\n   clangversiontag=\".19.1jl\"\n   llvmversiontag=$clangversiontag\n   clanglib=libclang.$dlext$clangversiontag\n   test -f lib/$clanglib\nfi\nclangcpplib=libclang-cpp.$dlext$clangversiontag\ntest -f lib/$clangcpplib\nllvmlib=libLLVM$llvmversiontag.${dlext}\n[ -f lib/$llvmlib ] || llvmlib=libLLVM.${dlext}$llvmversiontag\ntest -f lib/$llvmlib\n\necho \"Looking for ../artifacts/*/lib/$clanglib and ../artifacts/*/lib/$llvmlib\" 1>&2\n\nclang_search=\"../artifacts/*/lib/$clanglib\"\nllvm_search=\"../artifacts/*/lib/$llvmlib\"\nclang_uuid=\"`echo $clang_search | head -n 1 | sed 's|^../artifacts/\\([^/[:space:]]*\\).*|\\1|'`\"\nllvm_uuid=\"`echo $llvm_search | head -n 1 | sed 's|^../artifacts/\\([^/[:space:]]*\\).*|\\1|'`\"\n\nret=0\nif echo \"$clang_uuid\" | grep -q '*'; then\n   echo \"Failed to find clang library under path $clang_search\" 1>&2\n   ret=1\nfi\n\nif echo \"$llvm_uuid\" | grep -q '*'; then\n   echo \"Failed to find llvm library under path $llvm_search\" 1>&2\n   ret=1\nfi\n\n#trigger exit if at least one of the two library was not found\n[ $ret = 0 ] || false\n\ncat <<EOF 1>&2\nClang artifact uuid: $clang_uuid\nLLVM artifact uuid: $llvm_uuid\nEOF\n\n# Add a link to the clang resource directory\nln -sf artifacts/$clang_uuid ..\nmkdir -p lib/$clang_resource_dir\nif [ -d ../artifacts/$clang_uuid/lib/clang/19 ]; then\ncp -rp ../artifacts/$clang_uuid/lib/clang/19/include lib/\"$clang_resource_dir\"\nelse\n    cp -rp ../artifacts/$clang_uuid/lib/clang/19.1.7/include lib/\"$clang_resource_dir\"\nfi\n\n# Add libraries used by wrapit. Make copy as we haven't found how\n# To get symlinks to regular files included in the genrated tarball.\nrm \"lib/$clanglib\"\ncp -p \"../artifacts/$clang_uuid/lib/$clanglib\" lib/\nrm \"lib/$clangcpplib\"\ncp -p \"../artifacts/$clang_uuid/lib/$clangcpplib\" lib/\nrm \"lib/$llvmlib\"\ncp -p \"../artifacts/$llvm_uuid/lib/$llvmlib\" lib/\n#\n######################################################################\n\ninstall_license \"${WORKSPACE}/srcdir/wrapit/LICENSE\"\n"""
toplevel_block = ""
version = "v1.9.0"

