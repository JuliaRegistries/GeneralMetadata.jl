augment_platform_block = ""
dependencies = []
init_block = ""
julia_compat = "1.10"
lazy_artifacts = false
name = "iroh"
platforms = ["i686-linux-gnu", "x86_64-linux-gnu", "aarch64-linux-gnu", "armv6l-linux-gnueabihf", "armv7l-linux-gnueabihf", "i686-linux-musl", "x86_64-linux-musl", "aarch64-linux-musl", "armv6l-linux-musleabihf", "armv7l-linux-musleabihf", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-unknown-freebsd", "aarch64-unknown-freebsd", "x86_64-w64-mingw32"]
script = """macos_sdk_version=11.1\nmacosx_deployment_target=10.15\n# Move the SDK tarball out of `srcdir` on all platforms: any extra entry\n# in there defeats the automatic installation of license files, which\n# expects `srcdir` to contain a single top-level source directory.\nmv ${WORKSPACE}/srcdir/MacOSX${macos_sdk_version}.sdk.tar.xz ${WORKSPACE}/\nif [[ \"${target}\" == x86_64-apple-darwin* ]]; then\n    # Extract SDK. Also outside of `srcdir`, for the same reason.\n    echo \"Extracting MacOSX${macos_sdk_version}.sdk.tar.xz (this may take a while)\"\n    tar \\\n        --extract \\\n        --file=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk.tar.xz \\\n        --directory=${WORKSPACE} \\\n        --warning=no-unknown-keyword\n    old_sdkroot=${SDKROOT}\n    new_sdkroot=${WORKSPACE}/MacOSX${macos_sdk_version}.sdk\n    # Make sure libc++ header files are available at `usr/include/c++/v1`.\n    # Some SDKs ship their own (e.g. 15.0), which we leave alone; for those\n    # that don't, symlink the ones from the default SDK. Note we symlink\n    # the `v1` subdirectory rather than the whole `c++` directory: some\n    # SDKs (e.g. 10.13) contain `usr/include/c++/4.2.1` (but no `v1`), and\n    # symlinking `c++` onto that existing directory would silently create\n    # a nested `c++/c++` link, so libc++ headers like <new> are not found.\n    if [[ ! -d ${new_sdkroot}/usr/include/c++/v1 ]]; then\n        mkdir -p ${new_sdkroot}/usr/include/c++\n        ln -sT ${old_sdkroot}/usr/include/c++/v1 ${new_sdkroot}/usr/include/c++/v1\n    fi\n    # In the build environment `usr/local` of the default sys-root is a\n    # symlink to the destdir prefix, which puts the header files of the\n    # dependencies on the compilers' default search path. No SDK ships a\n    # `usr/local`, so replicate that symlink in the new SDK. `-T` makes\n    # this fail loudly should some SDK ship a `usr/local` after all,\n    # instead of silently creating a nested `usr/local/local` link.\n    ln -sT ${old_sdkroot}/usr/local ${new_sdkroot}/usr/local\n    # Fix toolchain files\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" ${MESON_TARGET_TOOLCHAIN} ${CMAKE_TARGET_TOOLCHAIN}\n    # Fix compiler wrappers\n    sed -i -e \"s+${old_sdkroot}+${new_sdkroot}+\" $(find /opt/bin/${target}* -type f -print)\n    SDKROOT=${new_sdkroot}\n    export MACOSX_DEPLOYMENT_TARGET=${macosx_deployment_target}\nfi\ncd ${WORKSPACE}/srcdir/iroh-c-ffi\n\ninstall_license LICENSE-MIT LICENSE-APACHE\n\n# `ring` (pulled in via rustls/quinn) compiles a bit of C in its build script.\n# Point the host compiler at the build compiler so that the native code path\n# works while cross-compiling (see Z/ZenohC, which has the same dependency).\nexport CC_$(echo ${rust_host} | sed \"s/-/_/g\")=${CC_BUILD}\n\n# musl targets default to a static CRT, which makes it impossible to produce a\n# `cdylib`.  Turn that off.\nif [[ \"${target}\" == *-musl* ]]; then\n    export RUSTFLAGS=\"-C target-feature=-crt-static\"\nfi\n\n# The checked-in `Cargo.lock` pins `netdev` 0.44.0, which gates the FreeBSD\n# `SIOCGIFXMEDIA` ioctl constant on `target_arch = \"x86_64\"` and therefore\n# fails to compile for `aarch64-unknown-freebsd` with\n#     error[E0425]: cannot find value `SIOCGIFXMEDIA` in this scope\n# netdev 0.45.0 widened that to `target_pointer_width = \"64\"` (and added\n# 32-bit arm/fallback arms).  `netdev` is pulled in via `netwatch`, whose\n# 0.19.0 release requires `netdev ^0.44`; the semver-compatible `netwatch`\n# 0.19.1 requires `netdev ^0.45`, so bumping `netwatch` is what lets the fixed\n# `netdev` in.  Do this on all platforms so that every build resolves the same\n# dependency versions.\ncargo update --package netwatch --precise 0.19.1\n\n# The crate declares crate-type = [\"staticlib\", \"cdylib\", \"lib\"]; ask for just\n# the cdylib so that we don't pay for building the static library as well.\ncargo rustc --release --lib --crate-type=cdylib\n\n# `libiroh_c_ffi.{so,dylib}` on Unix, `iroh_c_ffi.dll` on Windows.\ninstall -Dvm 755 target/${rust_target}/release/*iroh_c_ffi.${dlext} -t \"${libdir}\"\n\n# The C header is generated by `cargo run --features headers --bin\n# generate_headers`, which cannot run while cross-compiling.  Upstream checks\n# the generated header into the repository and its CI fails if it ever drifts\n# from the generator output, so we install the checked-in copy.\ninstall -Dvm 644 irohnet.h \"${includedir}/irohnet.h\"\n"""
toplevel_block = ""
version = "v0.101.0"

