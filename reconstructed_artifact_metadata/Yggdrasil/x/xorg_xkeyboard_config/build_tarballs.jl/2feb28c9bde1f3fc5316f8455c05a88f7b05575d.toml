init_block = """if Sys.islinux() || Sys.isfreebsd()\n    ENV[\"XKB_CONFIG_ROOT\"] = get(ENV, \"XKB_CONFIG_ROOT\", joinpath(artifact_dir, \"share\", \"X11\", \"xkb\"))\nend\n"""
